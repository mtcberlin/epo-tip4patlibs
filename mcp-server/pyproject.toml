[project]
name = "query-mcp"
version = "0.1.0"
description = "MCP server for AI-powered SQL query generation from natural language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0,<1.26.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_mcp"]

[project.scripts]
query-mcp = "query_mcp.server:main"
