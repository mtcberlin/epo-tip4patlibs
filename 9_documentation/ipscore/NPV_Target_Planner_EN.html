.opt-item:hover{border-color:#93c5fd;background:#f0f6ff}
.opt-item.sel-green{border-color:var(--green);background:#f0fdf4}

.opt-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}

.dot-yellow{background:var(--yellow)}

.nav-info{font-size:.8rem;color:#64748b;font-weight:600}
.btn{padding:9px 24px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}

.res-npv{text-align:center}
.res-npv-val{font-size:2.4rem;font-weight:800;color:var(--orange);line-height:1}
.res-npv-lbl{font-size:.78rem;opacity:.75;margin-top:4px}
.res-bar-wrap{flex:1;min-width:200px}
.res-bar-lbl{font-size:.8rem;opacity:.8;margin-bottom:6px}

.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}

.param-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px}
.param-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}

.badge-red{background:var(--red)}
.param-tip{font-size:.76rem;color:#475569;line-height:1.45}

.qual-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:.8rem;color:#374151;line-height:1.45}

.action-text{font-size:.82rem;color:#374151;line-height:1.5}
@media print{header,.step-bar,.npv-bar,.nav-bar{display:none!important}.page{display:block!important;padding:10px}body{background:#fff}}

<header>

};
var OEK_VALUES = {
  B5:[5,2,1,0.5,0], C2:[0.005,0.025,0.05,0.08,0.15], C3:[0.5,1,2,4,8],
  C6:[0.005,0.02,0.04,0.06,0.1], D1:[1,0.75,0.5,0.25,0], D2:[0.3,0.15,0.08,0.025,0.005],
  D3:[1.3,1.15,1.0,0.85,0.7], D4:[1.2,1.1,1.0,0.7,0.5]
};
var OEK_CARDS = [{"id": "B5", "icon": "&#9200;", "title": "Time to Market", "question": "When will your technology be ready to generate sales?", "context": "Every year of delay before launch means development costs pile up with no revenue to offset them. A technology that can be sold today is worth dramatically more than one that needs 2 or 3 more years of work — even if everything else is identical.", "opts": [{"label": "5+ years away", "desc": "We are still in early research or development — launch is far off"}, {"label": "About 2 years away", "desc": "Significant development work remains before we can launch"}, {"label": "About 1 year away", "desc": "We expect to be ready to launch within the next 12 months"}, {"label": "Around 6 months away", "desc": "Final preparations are under way — launch is imminent"}, {"label": "Ready now", "desc": "The technology is fully developed and we can start selling today"}]}, {"id": "C2", "icon": "&#128200;", "title": "Market Growth Rate", "question": "How fast is the market you are entering growing each year?", "context": "A faster-growing market means that each year you are on the market, your revenue base naturally expands — even before accounting for your own sales efforts.", "opts": [{"label": "Very slow — about 0.5% per year", "desc": "A mature or declining market, barely growing"}, {"label": "Slow — about 2.5% per year", "desc": "Modest growth, roughly in line with general inflation"}, {"label": "Moderate — about 5% per year", "desc": "Healthy, stable market expanding at a solid pace"}, {"label": "Fast — about 8% per year", "desc": "A dynamic, expanding sector with strong momentum"}, {"label": "Very fast — 15% or more per year", "desc": "A high-growth or booming market, rapidly expanding"}]}, {"id": "C3", "icon": "&#128336;", "title": "Competitive Window (Market Lifetime)", "question": "Once your product is on the market, how long will you realistically maintain a competitive edge before substitutes or copies arrive?", "context": "This is how many years of protected or semi-protected revenue you can realistically count on. It may end before the patent expires if competitors find workarounds. Be honest — overestimating this is the most common forecasting mistake.", "opts": [{"label": "About 6 months", "desc": "Competitors will react and close in very quickly"}, {"label": "About 1 year", "desc": "A very short window before substitutes emerge"}, {"label": "About 2 years", "desc": "Enough time to establish a position, but very tight"}, {"label": "About 4 years", "desc": "A solid window — enough to grow and recover investment"}, {"label": "8 years or more", "desc": "Long-lasting advantage with high barriers to imitation"}]}, {"id": "C6", "icon": "&#128181;", "title": "Revenue Uplift", "question": "By how much will this patent increase revenues in your business area, compared to operating without it?", "context": "Think of it as the commercial premium the patent delivers: extra sales from a superior product, higher prices, or new customers you would not otherwise reach.", "opts": [{"label": "Very small — less than 0.5% of sector revenue", "desc": "Barely a measurable difference commercially"}, {"label": "Small — about 2% of sector revenue", "desc": "A modest uplift, visible but not dramatic"}, {"label": "Moderate — about 4% of sector revenue", "desc": "A meaningful competitive advantage customers notice"}, {"label": "Significant — about 6% of sector revenue", "desc": "A clear, strong commercial premium driven by the patent"}, {"label": "Major — 10% or more of sector revenue", "desc": "A dominant advantage — customers pay substantially more or switch to you"}]}, {"id": "D1", "icon": "&#128274;", "title": "Business Dependency", "question": "If this patent were taken away today, what fraction of your business could you still run?", "context": "The more your business depends on this patent, the more revenue it is protecting — and therefore the greater its economic value. A patent that protects a marginal feature of one product is worth far less than one without which the whole business would collapse.", "opts": [{"label": "All of it — the business would carry on completely normally", "desc": "The patent does not protect any critical revenue"}, {"label": "About three-quarters — we would lose roughly 25% of output", "desc": "Some dependency, but most of the business would survive"}, {"label": "About half — we would lose roughly 50% of output", "desc": "The patent protects a major part of the business"}, {"label": "About a quarter — we would lose roughly 75% of output", "desc": "The business is highly dependent on this technology"}, {"label": "None — the entire business depends on this patent", "desc": "Without it, the business cannot operate"}]}, {"id": "D2", "icon": "&#128295;", "title": "Remaining Development Costs", "question": "How much more money still needs to be invested in this technology before it is ready to sell?", "context": "These are the costs you must pay before seeing any revenue — they appear as negative cash flows in the early years and directly reduce your NPV.", "opts": [{"label": "Very high — about 30% of our annual sector revenue", "desc": "Enormous remaining investment before launch"}, {"label": "High — about 15% of annual sector revenue", "desc": "Substantial costs still ahead before commercialisation"}, {"label": "Moderate — about 8% of annual sector revenue", "desc": "A significant but manageable pre-launch investment"}, {"label": "Low — about 2–3% of annual sector revenue", "desc": "Small remaining costs — we are nearly ready"}, {"label": "Minimal — less than 1% of annual sector revenue", "desc": "Virtually done — negligible further development needed"}]}, {"id": "D3", "icon": "&#9881;&#65039;", "title": "Production Cost Effect", "question": "Once commercialised, will this technology make your production more expensive or cheaper compared to today?", "context": "This effect applies every year you operate. A cost saving compounds across the entire revenue period — a cost increase is a persistent drag on margins.", "opts": [{"label": "Much more expensive — production costs rise by about 30%", "desc": "A significant ongoing cost penalty each year"}, {"label": "Somewhat more expensive — costs rise by about 15%", "desc": "A moderate annual cost increase"}, {"label": "No change — production costs stay the same", "desc": "Neutral — neither saving nor costing more"}, {"label": "Somewhat cheaper — production costs fall by about 15%", "desc": "A meaningful annual saving on operations"}, {"label": "Much cheaper — production costs fall by about 30%", "desc": "A major efficiency gain every year of operation"}]}, {"id": "D4", "icon": "&#127970;", "title": "Capital Investment at Launch", "question": "To implement this technology commercially, will you need more or less capital equipment than you currently have?", "context": "This is a one-time cost at the moment of launch. A large additional investment reduces early NPV; needing less capital than today is a positive bonus.", "opts": [{"label": "Significantly more — about 20% more capital than today", "desc": "A substantial one-time investment outlay at launch"}, {"label": "Slightly more — about 10% more capital than today", "desc": "A moderate additional investment at launch"}, {"label": "The same — no change in capital requirements", "desc": "Neutral — same level of investment as today"}, {"label": "Less — about 30% less capital than today", "desc": "A meaningful saving in capital at launch"}, {"label": "Much less — about 50% less capital than today", "desc": "Halving investment requirements — major capital saving"}]}];
var QUAL_QUESTIONS = [{"id": "Ag", "t": "Is the patent officially granted by a patent office?", "opts": ["Not yet — still pending, or not yet filed", "Yes, it is granted — but a legal challenge period is still open", "Yes, fully granted — and no challenges remain"]}, {"id": "Al", "t": "How many years of patent protection do you still have?", "opts": ["Less than 4 years remaining", "Between 4 and 8 years remaining", "More than 8 years remaining"]}, {"id": "Ab", "t": "How broadly does the patent protect the technology?", "opts": ["Narrowly — only one very specific form of the product", "Moderately — competitors would need real effort to work around it", "Broadly — covers the core principle, very hard to design around"]}, {"id": "Ac", "t": "In how many countries or markets is the patent registered?", "opts": ["Just one country", "A handful of key markets (around 3&ndash;5 countries)", "All major relevant markets worldwide"]}, {"id": "Ec", "t": "How central is this patent to what your company does?", "opts": ["Not really central — it supports a side activity", "Somewhat central — it underpins one important business line", "Absolutely central — it is a cornerstone of the whole business"]}, {"id": "Es", "t": "Is there a clear commercial plan for how this patent will be used?", "opts": ["No clear plan yet", "A partial plan exists but is not fully developed", "Fully integrated into the company's business strategy"]}];

var INSIGHTS = {"B5": {"1": "<strong>&#10060; Major obstacle.</strong> Five years is a very long road. Your development costs pile up year after year with zero revenue to show for it — and by the time you launch, competitors may have filled the gap. This scenario almost always leads to a very low or negative NPV.", "2": "<strong>&#9888;&#65039; Significant delay.</strong> Two years of remaining development work will delay your first euro of revenue and add substantial costs. It is still workable, but you will need a long market window and strong revenue impact to compensate. Look for ways to accelerate.", "3": "<strong>&#9888;&#65039; Borderline — manageable.</strong> One year to launch is the minimum we recommend. Development costs are limited, and revenue starts within 12 months. If your market and financial parameters are strong, this can still reach your NPV target.", "4": "<strong>&#9989; Strong position.</strong> Six months to launch means minimal remaining costs and revenue starts almost immediately. A solid positive contribution to your NPV.", "5": "<strong>&#9989; Best case.</strong> Ready to sell today — zero delay, zero remaining development cost. Every cash flow starts from year one at full strength. Maximum NPV from this parameter."}, "C2": {"1": "<strong>&#10060; Near-stagnant market.</strong> Growing at just 0.5% per year, this market is essentially flat. Revenue will barely increase over the patent life, and future cash flows lose most of their worth when discounted. Very hard to build meaningful NPV here.", "2": "<strong>&#9888;&#65039; Slow growth.</strong> At 2.5% per year — roughly in line with inflation — there is modest upside. The patent can still create value, but other parameters need to be particularly strong to compensate for the limited market momentum.", "3": "<strong>&#9888;&#65039; Healthy, workable.</strong> A 5% annual growth rate is solid. Revenue compounds at a reasonable pace year on year. Compatible with most NPV targets when the other parameters are also sound.", "4": "<strong>&#9989; Strong growth.</strong> At 8% per year, your revenue base expands quickly. Each additional year on the market delivers meaningfully more value. A significant NPV booster.", "5": "<strong>&#9989; Exceptional market.</strong> 15%+ annual growth is outstanding. Revenue compounds extremely fast, dramatically amplifying NPV. If your technology is entering a market growing this quickly, the financial outlook is very attractive."}, "C3": {"1": "<strong>&#10060; Far too short.</strong> Six months of market exclusivity is almost never enough to recover your investment. By the time competitors mobilise, your window is already closing. This score alone will typically prevent reaching any meaningful NPV target.", "2": "<strong>&#10060; Very tight.</strong> One year gives you an extremely short revenue runway. This might work only if your technology is already on the market (B5=5) and your revenue uplift is very high (C6=5). For most situations, it is insufficient.", "3": "<strong>&#9888;&#65039; Tight but workable.</strong> Two years is a limited window. You can establish a position and start recovering costs, but there is no room for delays or surprises. Other parameters — especially C6 and C2 — must be strong.", "4": "<strong>&#9989; Solid window.</strong> Four years is the recommended minimum for most NPV targets. Enough time to grow your position, generate substantial revenue, and recover the investment with room to spare.", "5": "<strong>&#9989; Outstanding.</strong> Eight years of competitive exclusivity is the strongest possible scenario. A long, protected revenue runway that dramatically multiplies NPV — this single parameter has the largest individual impact of any in the model."}, "C6": {"1": "<strong>&#10060; Negligible impact.</strong> Less than 0.5% revenue uplift means the patent barely moves the commercial needle. The financial return will struggle to justify even the cost of maintaining the patent in most revenue in the NPV formula is high — a strong positive contributor.", "5": "<strong>&#9989; Maximum protection.</strong> Your entire business depends on this patent. The protected revenue component of NPV is at its highest — this patent is your core commercial asset. The financial justification for maintaining and defending it is strongest here."}, "D2": {"1": "<strong>&#10060; Enormous remaining investment.</strong> Spending 30% of your sector revenues on further development before launch will absorb virtually all future value. This situation makes a positive NPV nearly impossible to achieve.", "2": "<strong>&#9888;&#65039; Heavy cost burden.</strong> 15% of sector revenues still to be spent before launch is a high hurdle. You will need a long and commercially successful market window to recover this. Actively explore whether costs can be reduced.", "3": "<strong>&#9888;&#65039; Moderate costs — manageable.</strong> 8% of sector revenues remaining in development. This is workable if your time to market is short (score 3 or better). If launch is still 2+ years away, this cost level will hurt NPV significantly.", "4": "<strong>&#9989; Low remaining costs.</strong> Only 2.5% of sector revenues left to spend before launch. You are close to the finish line. Small investment, near-term revenue — a strong position.", "5": "<strong>&#9989; Essentially done.</strong> Less than 1% remaining development costs means you are ready to commercialise. Future cash flows are almost entirely unencumbered by development drag — maximum net benefit."}, "D3": {"1": "<strong>&#10060; Major cost increase.</strong> Production becomes 30% more expensive. This cost increase erodes your profit margin on every single unit you sell, every single year — a persistent drag that compounds over the entire revenue period.", "2": "<strong>&#9888;&#65039; Cost increase — plan carefully.</strong> A 15% rise in production costs is a real and ongoing drain on margins. Your NPV will be noticeably lower than var PARAM_META = {"B5": {"icon": "&#9200;", "name": "Time to Market"}, "C2": {"icon": "&#128200;", "name": "Market Growth Rate"}, "C3": {"icon": "&#128336;", "name": "Competitive Window"}, "C6": {"icon": "&#128181;", "name": "Revenue Uplift"}, "D1": {"icon": "&#128274;", "name": "Business Dependency"}, "D2": {"icon": "&#128295;", "name": "Remaining Dev. Costs"}, "D3": {"icon": "&#9881;", "name": "Production Cost Effect"}, "D4": {"icon": "&#127970;", "name": "Capital Investment"}};


function fmtEur(n){
  if(!n&&n!==0) return '—';
  return n.toLocaleString('en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0});
}

function readSetup(){
  var g = function(id){return parseFloat(document.getElementById(id).value)||0;};
  inputs.bt = g('s_bt');
  inputs.targetPct = g('s_tpct')||15;
  inputs.sectorShare = g('s_sector')||30;
  inputs.costRatio = g('s_costs')||73;
  inputs.r = g('s_discount')||11;
  inputs.deprecPct = g('s_deprecpct')||2.5;
  inputs.deprecPeriod = g('s_deprecperiod')||8;
}

function calcNPV(){
  if(!inputs.bt||!inputs.sectorShare) return 0;
  var BT=inputs.bt, S=inputs.sectorShare/100, shareCosts=inputs.costRatio/100;
  var r=inputs.r/100, depPeriod=inputs.deprecPeriod;
  var shareDeprec_pct=inputs.deprecPct, invIndex=depPeriod*inputs.deprecPct/100;
  var T=OEK_VALUES.B5[oekScores.B5-1], g=OEK_VALUES.C2[oekScores.C2-1];
  var L=OEK_VALUES.C3[oekScores.C3-1], et=OEK_VALUES.C6[oekScores.C6-1];
  var D1=OEK_VALUES.D1[oekScores.D1-1], D2=OEK_VALUES.D2[oekScores.D2-1];
  var D3=OEK_VALUES.D3[oekScores.D3-1], D4=OEK_VALUES.D4[oekScores.D4-1];
  function frac(y){
    if(y<=T) return 0;
    if(y-T<1) return y-T;
    if(y<=T+L) return 1;
    if(y-T-L<1) return 1-(y-T-L);
    return 0;
  }
  var rev=[0];
  for(var y=1;y<=10;y++) rev.push(frac(y)*et*Math.pow(1+g,y-1)*S*Math.pow(1+g,y)*100);
  var yFirst=0;
  for(var y=1;y<=10;y++){if(rev[y]>0){yFirst=y;break;}}
  // Matches Excel 'Financial calculations' rows 98-121: sum revenue over every
  // year y with y>T and y<=T+1+depPeriod (always depPeriod+1 calendar-year
  // slots, not depPeriod), then divide by depPeriod.
  var sumR=0;
  for(var y=1;y<=10;y++){ if(y>T && y<=T+1+depPeriod) sumR+=rev[y]; }
  var avgRev=depPeriod>0?sumR/depPeriod:0;
  var van=0;
  for(var y=1;y<=10;y++){
    var rv=rev[y], fr=frac(y);
    var devCost=(y<=T)?D2*S*100:0;
    var costs=rv*D3*shareCosts+devCost;
    var invest=(y===yFirst&&yFirst>0)?avgRev*D4*invIndex:0;
    var invRed=(y===yFirst&&yFirst>0)?depPeriod*shareDeprec_pct*(1-D4)*S*Math.pow(1+g,y):0;
    var reg=fr*(1-shareCosts)*(1-D1)*S*Math.pow(1+g,y)*100;
    var eff=fr*shareCosts*(1-D3)*S*Math.pow(1+g,y)*100;
    van+=(rv-costs-invest+reg+eff+invRed)*BT/100/Math.pow(1+r,y);
  }
  return van;
}

function updateNPVBar(){
  var npv=calcNPV();
  var tgt=inputs.bt>0?(inputs.bt*inputs.targetPct/100):0;
  document.getElementById('npv-live').textContent=inputs.bt>0?fmtEur(npv):'—';
  document.getElementById('npv-tgt').textContent=inputs.bt>0?fmtEur(tgt):"enter setup first";
  var gap=document.getElementById('npv-gap');
  if(!inputs.bt){gap.textContent="enter setup"; gap.className='npv-gap gap-none'; return;}
  var pct=tgt>0?Math.round(npv/tgt*100):0;
  if(npv>=tgt){gap.textContent="&#10003; Target reached";gap.className='npv-gap gap-ok';}
  else if(pct>=80){gap.textContent='&#9888; {pct}% of target'.replace('{pct}',pct);gap.className='npv-gap gap-warn';}
  else{gap.textContent='&#10060; {pct}% of target'.replace('{pct}',pct);gap.className='npv-gap gap-bad';}
}

function selectOEK(id, score){
  oekScores[id]=score;
  for(var s=1;s<=5;s++){
    var el=document.getElementById('opt-'+id+'-'+s);
    if(!el) continue;
    el.className='opt-item'+(s===score?' sel-'+COLORS[id][s-1]:'');
  }
  var ins=document.getElementById('insight-'+id);
  if(ins&&INSIGHTS[id]&&INSIGHTS[id][score]){
    ins.className='oek-insight insight-'+COLORS[id][score-1];
    ins.innerHTML=INSIGHTS[id][score];
    ins.style.display='block';
  }
  updateNPVBar();
}

function selectQual(id, score){
  qualScores[id]=score;
  for(var s=1;s<=3;s++){
    var el=document.getElementById('qopt-'+id+'-'+s);
    if(el) el.classList.toggle('qual-sel', s===score);
  }
}

function navigate(dir){
  if(cur===0) readSetup();
  var pages=document.querySelectorAll('.page');
  var dots=document.querySelectorAll('.step-dot');
  var seps=document.querySelectorAll('.step-sep');
  pages[cur].classList.remove('active');
  dots[cur].classList.remove('active'); dots[cur].classList.add('done');
  if(seps[cur]) seps[cur].classList.add('done');
  cur=Math.max(0,Math.min(NPAGE-1,cur+dir));
  pages[cur].classList.add('active');
  dots[cur].classList.remove('done'); dots[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function goToPage(p){
  if(p<0||p>=NPAGE) return;
  if(cur===0) readSetup();
  document.querySelectorAll('.page')[cur].classList.remove('active');
  document.querySelectorAll('.step-dot')[cur].classList.remove('active');
  cur=p;
  document.querySelectorAll('.page')[cur].classList.add('active');
  document.querySelectorAll('.step-dot')[cur].classList.remove('done');
  document.querySelectorAll('.step-dot')[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function updateNavInfo(){
  var names=["Setup", "Technology", "Market", "Finance", "Legal & Strategy", "Results"];
  document.getElementById('nav-info').textContent="Step"+' '+(cur+1)+' '+"of"+' '+NPAGE+' — '+names[cur];
  document.getElementById('btn-prev').style.display=cur===0?'none':'';
  if(cur===NPAGE-1){
    document.getElementById('btn-next').style.display='none';
    if(!document.getElementById('btn-print2')){
      var pb=document.createElement('button');
      pb.className='btn btn-print'; pb.id='btn-print2';
      pb.innerHTML="&#128424; Print / PDF"; pb.onclick=function(){window.print();};
      document.querySelector('.nav-bar').appendChild(pb);
    }
  } else {
    document.getElementById('btn-next').style.display='';
    var pb2=document.getElementById('btn-print2'); if(pb2) pb2.remove();
  }
}

function buildStepBar(){
  var bar=document.getElementById('step-bar');
  var names=["Setup", "Technology", "Market", "Finance", "Legal &amp; Strategy", "Results"];
  var html='';
  for(var i=0;i<NPAGE;i++){
    if(i>0) html+='<div class="step-sep" id="sep-'+(i-1)+'"></div>';
    html+='<div class="step"><div class="step-dot'+(i===0?' active':'')
      +'" id="dot-'+i+'" onclick="goToPage('+i+')">'+(i+1)+'</div>'
      +'<span class="step-label">'+names[i]+'</span></div>';
  }
  bar.innerHTML=html;
}

function oekCard(id, icon, title, question, context, opts){
  var rows=opts.map(function(opt,i){
    var s=i+1, c=COLORS[id][i];
    return `<div class="opt-item" id="opt-${id}-${s}" onclick="selectOEK('${id}',${s})">
      <div class="opt-dot dot-${c}">${s}</div>
      <div><div class="opt-label">${opt.label}</div><div class="opt-desc">${opt.desc}</div></div>
    </div>`;
  }).join('');
  return `<div class="oek-card">
    <div class="oek-card-header">
      <div class="oek-icon">${icon}</div>
      <div><div class="oek-title">${title}</div><div class="oek-question">${question}</div></div>
    </div>
    <div class="oek-context">${context}</div>
    <div class="opt-row">${rows}</div>
    <div class="oek-insight" id="insight-${id}"></div>
  </div>`;
}

function qualCard(id, question, opts){
  var rows=opts.map(function(opt,i){
    var s=i+1;
    return `<div class="qual-opt" id="qopt-${id}-${s}" onclick="selectQual('${id}',${s})">
      <div class="qual-num">${s}</div>${opt}
    </div>`;
  }).join('');
  return `<div class="qual-card"><div class="qual-q">${question}</div><div class="qual-opts">${rows}</div></div>`;
}

      <div id="actions-list"></div>
    </div>
    <div style="text-align:center;margin:20px 0">
      <button class="btn btn-print" onclick="window.print()">&#128424; Print / Save PDF</button>
    </div>
  `;
  pagesDiv.appendChild(p5);
}

var PARAM_TIPS = {"B5": {"red": "Accelerate your path to market immediately — this is the highest-priority action. Every extra year of delay before launch is extremely costly.", "yellow": "You are within reach of launch. Focus on removing any remaining obstacles to reduce time to market below 1 year if at all possible.", "green": "Good. Protect this timeline — avoid scope creep or regulatory delays that could push the launch date back."}, "C2": {"red": "The market you are targeting grows very slowly. Consider whether adjacent, faster-growing segments could be addressed with the same technology.", "yellow": "Moderate market growth. Make sure your commercial window (C3) and revenue uplift (C6) are as strong as possible to compensate.", "green": "Strong market growth — make sure your go-to-market plan is ready to capture it before competitors move."}, "C3": {"red": "Your competitive window is too short to recover the investment. Think hard about what would extend market exclusivity: broader claims, trade secrets, regulatory moats.", "yellow": "A 2-year window is tight. Work on building switching costs, customer relationships and follow-on innovations to extend it.", "green": "A solid competitive window. Use this time actively — the window will not stay open forever."}, "C6": {"red": "The patent is delivering very little commercial uplift. Revisit whether the technology is genuinely differentiated in the eyes of customers.", "yellow": "The revenue uplift is workable but modest. Invest in commercial validation — are customers actually willing to pay a premium?", "green": "Strong commercial impact. Capture it through pricing strategy and active sales focus on the patent-enabled benefits."}, "D1": {"red": "This patent protects little of your core revenue. The economic case for maintaining it is weak unless other parameters are exceptional.", "yellow": "The patent protects roughly half your revenue — a meaningful but not critical dependency. Consider restructuring operations to increase reliance on the patented technology.", "green": "The patent protects the heart of your business. This is a strong argument for investing in its defence and extension."}, "D2": {"red": "Remaining development costs are very high and will severely damage NPV. Seek funding (grants, R&D tax credits) and rigorously scope what is strictly necessary.", "yellow": "Moderate remaining costs. Apply for R&D incentives and IP Box tax regimes where available — these can reduce the effective cost significantly.", "green": "Low remaining costs. Make sure development stays on track and on budget to preserve this advantage."}, "D3": {"red": "Production becomes significantly more expensive. Explore process improvements, automation or outsourcing to reduce the cost impact before launch.", "yellow": "Neutral cost position. Look for opportunities to turn this into a cost advantage through process optimisation.", "green": "The technology makes you more efficient — make this part of your commercial story, as lower costs mean more competitive pricing or higher margins."}, "D4": {"red": "The additional capital requirement at launch is high. Explore leasing, phased rollout or contract manufacturing to reduce the upfront outlay.", "yellow": "Neutral investment. No extra burden, but also no saving — look for opportunities to reduce the capital footprint.", "green": "Lower capital requirements free up resources. Use this financial flexibility to strengthen other parts of the business plan."}};


function updateResults(){
  readSetup();
  var npv=calcNPV();
  var tgt=inputs.bt>0?(inputs.bt*inputs.targetPct/100):0;
  var pct=tgt>0?Math.round(npv/tgt*100):0;
  var barPct=Math.min(pct,120);
  document.getElementById('res-npv-val').textContent=inputs.bt>0?fmtEur(npv):'—';
  document.getElementById('res-tgt-lbl').textContent="Target: "+(inputs.bt>0?fmtEur(tgt):'—');
  var fill=document.getElementById('res-bar-fill');
  fill.style.width=barPct+'%';
  fill.style.background=pct>=100?'var(--green)':pct>=80?'var(--yellow)':'var(--red)';
  var verdict='';
  if(!inputs.bt){verdict="Enter your company turnover and target on the Setup page to see your result.";}
  else if(pct>=100){verdict="<strong>&#10003; Target reached.</strong> Your current parameter profile supports an NPV that meets or exceeds your goal. Focus on defending this position — protect the technology, enforce the patent, and execute the commercial plan.";}
  else if(pct>=80){verdict='<strong>&#9888; Almost there — {pct}% of target.</strong> You are close. One or two focused improvements in your weakest parameters should close the gap. See the priority actions below.'.replace('{pct}',pct);}
  else if(pct>=50){verdict='<strong>&#9888; Partway there — {pct}% of target.</strong> Several parameters need strengthening. The NPV gap is real but closable. Prioritise the red-flagged items below.'.replace('{pct}',pct);}
  else{verdict='<strong>&#10060; Significant gap — {pct}% of target.</strong> The current profile falls well short of the goal. Major changes in multiple parameters are required before the patent can justify its commercial target.'.replace('{pct}',pct);}
  document.getElementById('res-verdict').innerHTML=verdict;
  document.getElementById('res-bar-lbl').textContent='You are at {pct}% of your target'.replace('{pct}',pct);

  // Parameter grid
  var pg=document.getElementById('param-grid'); pg.innerHTML='';
  var reds=[],yellows=[];
  Object.keys(PARAM_META).forEach(function(id){
    var score=oekScores[id], color=COLORS[id][score-1];
    var m=PARAM_META[id];
    var icon=color==='green'?'&#9989;':color==='yellow'?'&#9888;&#65039;':'&#10060;';
    var badgeCls='badge-'+color;
    var tip=PARAM_TIPS[id]?PARAM_TIPS[id][color]:'';
    var html='<div class="param-card">'
      +'<div class="param-head">'
      +'<span class="param-icon">'+m.icon+'</span>'
      +'<span class="param-name">'+m.name+'</span>'
      +'<span class="param-badge '+badgeCls+'">'+icon+' Score '+score+'</span>'
      +'</div>'
      +'<div class="param-tip">'+tip+'</div>'
      +'</div>';
    pg.innerHTML+=html;
    if(color==='red') reds.push({id:id,score:score,name:m.name,tip:PARAM_TIPS[id].red});
    else if(color==='yellow') yellows.push({id:id,score:score,name:m.name,tip:PARAM_TIPS[id].yellow});
  });

  // Qualitative result
  var legalScore=qualScores.Ag+qualScores.Al+qualScores.Ab+qualScores.Ac;
  var stratScore=qualScores.Ec+qualScores.Es;
  var legalStatus=legalScore>=10?{icon:'&#9989;',color:'#16a34a',label:"Strong legal protection"}:legalScore>=7?{icon:'&#9888;&#65039;',color:'#d97706',label:"Adequate — some gaps"}:{icon:'&#10060;',color:'#dc2626',label:"Needs attention"};
  var stratStatus=stratScore>=5?{icon:'&#9989;',color:'#16a34a',label:"Well aligned with strategy"}:stratScore>=4?{icon:'&#9888;&#65039;',color:'#d97706',label:"Partially aligned"}:{icon:'&#10060;',color:'#dc2626',label:"Strategy alignment missing"};
  var legalRec=legalScore<7?"Work on patent grant status, remaining life, geographic coverage and claim breadth to build a solid legal foundation that can actually protect the NPV you are targeting.":legalScore<10?"Legal position is adequate but has gaps. Prioritise the weakest legal element (coverage or enforceability) to reduce the risk of losing your competitive window unexpectedly.":"Your legal foundation is solid. Keep monitoring for infringement and reassess coverage every 2&ndash;3 years.";
  var stratRec=stratScore<4?"A patent without a clear commercial plan rarely reaches its potential NPV. Define how you will use it: direct sales, licensing, or defensive positioning — and integrate it into your annual business plan.":stratScore<5?"Your strategy is partially in place. Formalise the commercial plan and ensure leadership is committed to deploying the patent actively.":"Excellent strategic alignment. Make sure the plan is reviewed annually and stays connected to business priorities.";
  document.getElementById('qual-result').innerHTML='<h3>&#9878;&#65039; Legal &amp; Strategic Foundation</h3>'
    +'<div class="qual-row"><div class="qual-dot" style="background:'+legalStatus.color+'"></div><div><strong>Legal protection: '+legalStatus.icon+' '+legalStatus.label+'</strong><br>'+legalRec+'</div></div>'
    +'<div class="qual-row"><div class="qual-dot" style="background:'+stratStatus.color+'"></div><div><strong>Strategic alignment: '+stratStatus.icon+' '+stratStatus.label+'</strong><br>'+stratRec+'</div></div>';

  // Actions
  var actions=[].concat(reds,yellows).slice(0,4);
  var al=document.getElementById('actions-list');
  if(actions.length===0){
    al.innerHTML='<div class="action-item"><div class="action-num">&#10003;</div><div class="action-text">All key parameters are in the green zone. Maintain the current position, enforce the patent actively, and execute the commercial plan.</div></div>';
  } else {
    al.innerHTML=actions.map(function(a,i){
      return '<div class="action-item"><div class="action-num">'+(i+1)+'</div><div class="action-text"><strong>'+a.name+'</strong> (current score: {score}): '.replace('{score}',a.score)+a.tip+'</div></div>';
    }).join('');
  }

  updateNPVBar();
}
