# Secret scan and course invariants on every PR and push. The job name `check` is the required status check on develop.
# gitleaks pinned by version and sha256, the same as in mtc-patscenario's security.yml.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/no-ignore"
      - name: Secrets in this event's commits and in the tree
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}"   # first push: the whole history up to this commit
          fi
          opts=(--redact --no-banner --verbose --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore")
          "$RUNNER_TEMP/gitleaks" git "${opts[@]}" --log-opts="${range}" .
          "$RUNNER_TEMP/gitleaks" dir "${opts[@]}" .
      - name: Course invariants (compile, tip_tools copies, notebooks, guest outputs, install.sh)
        run: python3 .github/scripts/check_course.py
