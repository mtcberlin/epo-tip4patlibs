</style>

var INSIGHTS = {"B5": {"1": "<strong>&#10060; Ostacolo critico.</strong> Cinque anni sono un percorso molto lungo. I costi di sviluppo si accumulano anno dopo anno senza nessun ricavo a compensarli — e quando finalmente arriverai sul mercato, i concorrenti potrebbero aver già occupato lo spazio. Questo scenario porta quasi sempre a un VAN molto basso o negativo.", "2": "<strong>&#9888;&#65039; Ritardo significativo.</strong> Due anni di sviluppo residuo ritarderanno il primo euro di ricavi e aggiungeranno costi sostanziali. È ancora recuperabile, ma avrai bisogno di una lunga finestra di mercato e un forte impatto sui ricavi per compensare. Cerca modi per accelerare.", "3": "<strong>&#9888;&#65039; Al limite — gestibile.</strong> Un anno al lancio è il minimo che raccomandiamo. I costi di sviluppo sono limitati e i ricavi iniziano entro 12 mesi. Se i parametri di mercato e finanziari sono solidi, puoi ancora raggiungere l'obiettivo VAN.", "4": "<strong>&#9989; Posizione solida.</strong> Sei mesi al lancio significano costi residui minimi e ricavi che partono quasi subito. Un contributo positivo e concreto al tuo VAN.", "5": "<strong>&#9989; Caso ottimale.</strong> Pronti a vendere oggi — zero ritardo, zero costi di sviluppo residui. Ogni flusso di cassa inizia dall'anno uno a piena intensità. VAN massimo da questo parametro."}, "C2": {"1": "<strong>&#10060; Mercato quasi stagnante.</strong> Con una crescita di appena lo 0,5% annuo, questo mercato è sostanzialmente piatto. I ricavi aumenteranno appena nel corso della vita del brevetto, e i flussi di cassa futuri perdono gran parte del loro valore una volta attualizzati. Costruire un VAN significativo in questo contesto è molto difficile.", "2": "<strong>&#9888;&#65039; Crescita lenta.</strong> Al 2,5% annuo — grossomodo in linea con l'inflazione — c'è un modesto potenziale. Il brevetto può ancora creare valore, ma altri parametri devono essere particolarmente forti per compensare lo slancio limitato del mercato.", "3": "<strong>&#9888;&#65039; Sano e gestibile.</strong> Un tasso di crescita annuo del 5% è solido. I ricavi si compongono a un ritmo ragionevole anno dopo anno. Compatibile con la maggior parte degli obiettivi VAN quando gli altri parametri sono anch'essi validi.", "4": "<strong>&#9989; Crescita sostenuta.</strong> All'8% annuo, la tua base di ricavi si espande rapidamente. Ogni anno aggiuntivo sul mercato porta valore in misura significativamente maggiore. Un booster rilevante per il VAN.", "5": "<strong>&#9989; Mercato eccezionale.</strong> Una crescita annua del 15% o più è straordinaria. I ricavi si compongono a velocità elevata, amplificando drasticamente il VAN. Se la tua tecnologia entra in un mercato con questa crescita, le prospettive finanziarie sono molto attraenti."}, "C3": {"1": "<strong>&#10060; Decisamente troppo breve.</strong> Sei mesi di esclusiva commerciale non bastano quasi mai a recuperare l'investimento. Nel momento in cui i concorrenti si mobilitano, la tua finestra si sta già chiudendo. Questo punteggio da solo impedisce tipicamente di raggiungere qualsiasi obiettivo VAN significativo.", "2": "<strong>&#10060; Finestra molto stretta.</strong> Un anno offre una pista di entrate estremamente corta. Potrebbe funzionare solo se la tecnologia è già sul mercato (B5=5) e l'incremento dei ricavi è molto elevato (C6=5). Per la maggior parte delle situazioni, è insufficiente.", "3": "<strong>&#9888;&#65039; Stretto ma gestibile.</strong> Due anni sono una finestra limitata. Puoi stabilire una posizione e iniziare a recuperare i costi, ma non c'è margine per ritardi o imprevisti. Gli altri parametri — in particolare C6 e C2 — devono essere forti.", "4": "<strong>&#9989; Finestra solida.</strong> Quattro anni sono il minimo raccomandato per la maggior parte degli obiettivi VAN. Tempo sufficiente per far crescere la posizione, generare ricavi sostanziali e recuperare l'investimento con margine.", "5": "<strong>&#9989; Eccellente.</strong> Otto anni di esclusiva competitiva sono lo scenario più favorevole possibile. Una lunga pista di ricavi protetti che moltiplica drasticamente il VAN — questo singolo parametro ha il maggiore impatto individuale di tutti nel modello."}, "C6": {"1": "<strong>&#10060; Impatto trascurabile.</strong> Meno dello 0,5% di incremento dei ricavi significa che il brevetto sposta appena l'ago della bilancia commerciale. Il ritorno finanziario fatica a giustificare anche solo il costo del mantenimento del brevetto nella maggior parte dei Paesi.", "2": "<strong>&#9888;&#65039; Piccolo incremento.</strong> Un aumento del 2% dei ricavi è modesto. Su una base settoriale di €5M si traduce in circa €100K di ricavi aggiuntivi annui al picco — non trascurabile, ma compatibile con l'obiettivo VAN solo se gli altri parametri sono molto forti.", "3": "<strong>&#9888;&#65039; Soglia gestibile.</strong> Un incremento del 4% è il minimo gestibile per la maggior parte degli obiettivi VAN. Su una base settoriale di €5M si traducono in circa €200K di ricavi aggiuntivi annui — significativo, soprattutto su una finestra di 4 anni.", "4": "<strong>&#9989; Forte impatto commerciale.</strong> Un incremento del 6% dei ricavi mostra chiaramente che il mercato è disposto a pagare un premio per ciò che questo brevetto offre. Un driver VAN positivo e affidabile.", "5": "<strong>&#9989; Eccezionale.</strong> Il 10% o più di ricavi aggiuntivi significa che il brevetto sta offrendo un vantaggio competitivo dominante — i clienti pagano significativamente di più o tu catturi una quota molto più ampia. Il driver di ricavi più forte nel modello."}, "D1": {"1": "<strong>&#10060; Il brevetto non protegge i ricavi centrali.</strong> Se la tua attività può andare avanti normalmente senza questo brevetto, allora non sta proteggendo nessun reddito essenziale. Il termine positivo più importante nella formula VAN — chiamato ricavi protetti — scende a quasi zero. Il brevetto ha un valore economico molto limitato in questo scenario.", "2": "<strong>&#9888;&#65039; Dipendenza limitata.</strong> Solo il 25% della produzione sarebbe a rischio senza questo brevetto. C'è una certa protezione, ma la maggior parte dei ricavi non dipende dal brevetto. I ricavi protetti nella formula sono modesti.", "3": "<strong>&#9888;&#65039; Dipendenza significativa.</strong> Senza questo brevetto, circa metà della produzione sarebbe a rischio. Questa rappresenta una protezione economica reale — il brevetto è importante per la tua attività e contribuisce significativamente al VAN.", "4": "<strong>&#9989; Alta dipendenza.</strong> Solo il 25% della produzione sopravvivrebbe senza questo brevetto. Questa tecnologia è essenziale per le tue operazioni, e i ricavi protetti nella formula VAN sono elevati — un forte contributore positivo.", "5": "<strong>&#9989; Protezione massima.</strong> L'intera attività dipende da questo brevetto. La componente di ricavi protetti del VAN è al suo massimo — questo brevetto è il tuo asset commerciale principale. La giustificazione finanziaria per mantenerlo e difenderlo è qui al suo punto più forte."}, "D2": {"1": "<strong>&#10060; Investimento residuo enorme.</strong> Spendere il 30% dei ricavi del settore in ulteriore sviluppo prima del lancio assorberà praticamente tutto il valore futuro. In questa situazione, ottenere un VAN positivo è quasi impossibile.", "2": "<strong>&#9888;&#65039; Onere di costo elevato.</strong> Il 15% dei ricavi del settore ancora da spendere prima del lancio è un ostacolo alto. Avrai bisogno di una finestra di mercato lunga e commercialmente di successo per recuperarlo. Esplora attivamente se i costi possono essere ridotti.", "3": "<strong>&#9888;&#65039; Costi moderati — gestibili.</strong> L'8% dei ricavi del settore ancora in sviluppo. È gestibile se il tempo al mercato è breve (punteggio 3 o superiore). Se il lancio è ancora a 2+ anni, questo livello di costi pesarà significativamente sul VAN.", "4": "<strong>&#9989; Costi residui bassi.</strong> Solo il 2,5% dei ricavi del settore ancora da spendere prima del lancio. Sei vicino al traguardo. Investimento ridotto, ricavi imminenti — una posizione solida.", "5": "<strong>&#9989; Praticamente terminato.</strong> Meno dell'1% di costi di sviluppo residui significa che sei pronto per la commercializzazione. I flussi di cassa futuri sono quasi completamente liberi dal peso dello sviluppo — beneficio netto massimo."}, "D3": {"1": "<strong>&#10060; Aumento significativo dei costi.</strong> La produzione diventa il 30% più costosa. Questo aumento erode il margine di profitto su ogni unità venduta, ogni anno — un freno persistente che si accumula per tutto il periodo di ricavi.", "2": "<strong>&#9888;&#65039; Aumento dei costi — pianifica con attenzione.</strong> Un aumento del 15% dei costi di produzione è un onere reale e continuativo sui margini. Il tuo VAN sarà notevolmente inferiore rispetto a uno scenario neutro. Si possono ridurre questi costi con efficienze di processo?", "3": "<strong>&#9888;&#65039; Neutro — né aiutato né penalizzato.</strong> Nessuna variazione nei costi di produzione. Il brevetto non rende la produzione più o meno costosa. Questo è il riferimento — accettabile, ma si perde il vantaggio del risparmio dei punteggi più alti.", "4": "<strong>&#9989; Risparmio sui costi — ogni anno.</strong> La tecnologia riduce i costi di produzione del 15%. Ogni anno di operatività, risparmi rispetto a prima. Un contributo annuo significativo e ricorrente al VAN.", "5": "<strong>&#9989; Eccellente guadagno di efficienza.</strong> Il 30% in meno di costi di produzione significa che il brevetto rende le tue operazioni molto più competitive. Questo risparmio ricorrente si accumula per tutto il periodo di ricavi ed è uno dei contributori annui più potenti al VAN."}, "D4": {"1": "<strong>&#10060; Elevato fabbisogno di capitale iniziale.</strong> Aver bisogno del 20% di capitale in più rispetto a oggi per implementare questa tecnologia crea un costo una tantum significativo al lancio. Questo riduce il VAN dei primi anni e mette pressione sui flussi di cassa proprio quando i ricavi stanno appena iniziando.", "2": "<strong>&#9888;&#65039; Investimento extra moderato al lancio.</strong> Il 10% di capitale in più rispetto a oggi — un onere gestibile, ma che riduce il VAN del primo anno. Vale la pena trovare modi per ridurlo se possibile.", "3": "<strong>&#9888;&#65039; Nessun cambiamento di capitale — neutro.</strong> Lo stesso investimento di oggi. Il brevetto non richiede alcun esborso di capitale aggiuntivo, il che è un riferimento accettabile.", "4": "<strong>&#9989; Risparmio di capitale al lancio.</strong> Il 30% di capitale in meno significa che liberi risorse significative nel primo anno commerciale. Un miglioramento reale del VAN iniziale e della flessibilità finanziaria.", "5": "<strong>&#9989; Risparmio di capitale rilevante.</strong> Dimezzare il fabbisogno di capitale è eccellente — ottieni molto di più con molto meno investimento iniziale. Il miglioramento più forte possibile al flusso di cassa dell'anno di lancio."}};

function fmtEur(n){
  if(!n&&n!==0) return '—';
  return n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
}

function readSetup(){
  var g = function(id){return parseFloat(document.getElementById(id).value)||0;};
  inputs.bt = g('s_bt');
  inputs.targetPct = g('s_tpct')||15;
  inputs.sectorShare = g('s_sector')||30;
  inputs.costRatio = g('s_costs')||73;
  inputs.r = g('s_discount')||11;
  inputs.deprecPct = g('s_deprecpct')||2.5;
  inputs.deprecPeriod = g('s_deprecperiod')||8;
}

function calcNPV(){
  if(!inputs.bt||!inputs.sectorShare) return 0;
  var BT=inputs.bt, S=inputs.sectorShare/100, shareCosts=inputs.costRatio/100;
  var r=inputs.r/100, depPeriod=inputs.deprecPeriod;
  var shareDeprec_pct=inputs.deprecPct, invIndex=depPeriod*inputs.deprecPct/100;
  var T=OEK_VALUES.B5[oekScores.B5-1], g=OEK_VALUES.C2[oekScores.C2-1];
  var L=OEK_VALUES.C3[oekScores.C3-1], et=OEK_VALUES.C6[oekScores.C6-1];
  var D1=OEK_VALUES.D1[oekScores.D1-1], D2=OEK_VALUES.D2[oekScores.D2-1];
  var D3=OEK_VALUES.D3[oekScores.D3-1], D4=OEK_VALUES.D4[oekScores.D4-1];
  function frac(y){
    if(y<=T) return 0;
    if(y-T<1) return y-T;
    if(y<=T+L) return 1;
    if(y-T-L<1) return 1-(y-T-L);
    return 0;
  }
  var rev=[0];
  for(var y=1;y<=10;y++) rev.push(frac(y)*et*Math.pow(1+g,y-1)*S*Math.pow(1+g,y)*100);
  var yFirst=0;
  for(var y=1;y<=10;y++){if(rev[y]>0){yFirst=y;break;}}
  // Matches Excel 'Financial calculations' rows 98-121: sum revenue over every
  // year y with y>T and y<=T+1+depPeriod (always depPeriod+1 calendar-year
  // slots, not depPeriod), then divide by depPeriod.
  var sumR=0;
  for(var y=1;y<=10;y++){ if(y>T && y<=T+1+depPeriod) sumR+=rev[y]; }
  var avgRev=depPeriod>0?sumR/depPeriod:0;
  var van=0;
  for(var y=1;y<=10;y++){
    var rv=rev[y], fr=frac(y);
    var devCost=(y<=T)?D2*S*100:0;
    var costs=rv*D3*shareCosts+devCost;
    var invest=(y===yFirst&&yFirst>0)?avgRev*D4*invIndex:0;
    var invRed=(y===yFirst&&yFirst>0)?depPeriod*shareDeprec_pct*(1-D4)*S*Math.pow(1+g,y):0;
    var reg=fr*(1-shareCosts)*(1-D1)*S*Math.pow(1+g,y)*100;
    var eff=fr*shareCosts*(1-D3)*S*Math.pow(1+g,y)*100;
    van+=(rv-costs-invest+reg+eff+invRed)*BT/100/Math.pow(1+r,y);
  }
  return van;
}

function updateNPVBar(){
  var npv=calcNPV();
  var tgt=inputs.bt>0?(inputs.bt*inputs.targetPct/100):0;
  document.getElementById('npv-live').textContent=inputs.bt>0?fmtEur(npv):'—';
  document.getElementById('npv-tgt').textContent=inputs.bt>0?fmtEur(tgt):"inserisci i dati prima";
  var gap=document.getElementById('npv-gap');
  if(!inputs.bt){gap.textContent="configura prima"; gap.className='npv-gap gap-none'; return;}
  var pct=tgt>0?Math.round(npv/tgt*100):0;
  if(npv>=tgt){gap.textContent="&#10003; Obiettivo raggiunto";gap.className='npv-gap gap-ok';}
  else if(pct>=80){gap.textContent='&#9888; {pct}% dell\'obiettivo'.replace('{pct}',pct);gap.className='npv-gap gap-warn';}
  else{gap.textContent='&#10060; {pct}% dell\'obiettivo'.replace('{pct}',pct);gap.className='npv-gap gap-bad';}
}

function selectOEK(id, score){
  oekScores[id]=score;
  for(var s=1;s<=5;s++){
    var el=document.getElementById('opt-'+id+'-'+s);
    if(!el) continue;
    el.className='opt-item'+(s===score?' sel-'+COLORS[id][s-1]:'');
  }
  var ins=document.getElementById('insight-'+id);
  if(ins&&INSIGHTS[id]&&INSIGHTS[id][score]){
    ins.className='oek-insight insight-'+COLORS[id][score-1];
    ins.innerHTML=INSIGHTS[id][score];
    ins.style.display='block';
  }
  updateNPVBar();
}

function selectQual(id, score){
  qualScores[id]=score;
  for(var s=1;s<=3;s++){
    var el=document.getElementById('qopt-'+id+'-'+s);
    if(el) el.classList.toggle('qual-sel', s===score);
  }
}

function navigate(dir){
  if(cur===0) readSetup();
  var pages=document.querySelectorAll('.page');
  var dots=document.querySelectorAll('.step-dot');
  var seps=document.querySelectorAll('.step-sep');
  pages[cur].classList.remove('active');
  dots[cur].classList.remove('active'); dots[cur].classList.add('done');
  if(seps[cur]) seps[cur].classList.add('done');
  cur=Math.max(0,Math.min(NPAGE-1,cur+dir));
  pages[cur].classList.add('active');
  dots[cur].classList.remove('done'); dots[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function goToPage(p){
  if(p<0||p>=NPAGE) return;
  if(cur===0) readSetup();
  document.querySelectorAll('.page')[cur].classList.remove('active');
  document.querySelectorAll('.step-dot')[cur].classList.remove('active');
  cur=p;
  document.querySelectorAll('.page')[cur].classList.add('active');
  document.querySelectorAll('.step-dot')[cur].classList.remove('done');
  document.querySelectorAll('.step-dot')[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function updateNavInfo(){
  var names=["Configurazione", "Tecnologia", "Mercato", "Finanza", "Legale & Strategia", "Risultati"];
  document.getElementById('nav-info').textContent="Passo"+' '+(cur+1)+' '+"di"+' '+NPAGE+' — '+names[cur];
  document.getElementById('btn-prev').style.display=cur===0?'none':'';
  if(cur===NPAGE-1){
    document.getElementById('btn-next').style.display='none';
    if(!document.getElementById('btn-print2')){
      var pb=document.createElement('button');
      pb.className='btn btn-print'; pb.id='btn-print2';
      pb.innerHTML="&#128424; Stampa / PDF"; pb.onclick=function(){window.print();};
      document.querySelector('.nav-bar').appendChild(pb);
    }
  } else {
    document.getElementById('btn-next').style.display='';
    var pb2=document.getElementById('btn-print2'); if(pb2) pb2.remove();
  }
}

function buildStepBar(){
  var bar=document.getElementById('step-bar');
  var names=["Configurazione", "Tecnologia", "Mercato", "Finanza", "Legale &amp; Strategia", "Risultati"];
  var html='';
  for(var i=0;i<NPAGE;i++){
    if(i>0) html+='<div class="step-sep" id="sep-'+(i-1)+'"></div>';
    html+='<div class="step"><div class="step-dot'+(i===0?' active':'')
      +'" id="dot-'+i+'" onclick="goToPage('+i+')">'+(i+1)+'</div>'
      +'<span class="step-label">'+names[i]+'</span></div>';
  }
  bar.innerHTML=html;
}

function oekCard(id, icon, title, question, context, opts){
  var rows=opts.map(function(opt,i){
    var s=i+1, c=COLORS[id][i];
    return `<div class="opt-item" id="opt-${id}-${s}" onclick="selectOEK('${id}',${s})">
      <div class="opt-dot dot-${c}">${s}</div>
      <div><div class="opt-label">${opt.label}</div><div class="opt-desc">${opt.desc}</div></div>
    </div>`;
  }).join('');
  return `<div class="oek-card">
    <div class="oek-card-header">
      <div class="oek-icon">${icon}</div>
      <div><div class="oek-title">${title}</div><div class="oek-question">${question}</div></div>
    </div>
    <div class="oek-context">${context}</div>
    <div class="opt-row">${rows}</div>
    <div class="oek-insight" id="insight-${id}"></div>
  </div>`;
}

function qualCard(id, question, opts){
  var rows=opts.map(function(opt,i){
    var s=i+1;
    return `<div class="qual-opt" id="qopt-${id}-${s}" onclick="selectQual('${id}',${s})">
      <div class="qual-num">${s}</div>${opt}
    </div>`;
  }).join('');
  return `<div class="qual-card"><div class="qual-q">${question}</div><div class="qual-opts">${rows}</div></div>`;
}

var PARAM_TIPS = {"B5": {"red": "Accelera immediatamente il percorso verso il mercato — questa è l'azione ad altissima priorità. Ogni anno aggiuntivo di ritardo prima del lancio è estremamente costoso.", "yellow": "Sei vicino al lancio. Concentrati sull'eliminare gli ostacoli residui per ridurre il tempo al mercato sotto 1 anno, se possibile.", "green": "Bene. Proteggi questa tempistica — evita derive di scope o ritardi regolatori che potrebbero posticipare la data di lancio."}, "C2": {"red": "Il mercato che stai puntando cresce molto lentamente. Considera se segmenti adiacenti in più rapida crescita potrebbero essere raggiunti con la stessa tecnologia.", "yellow": "Crescita moderata del mercato. Assicurati che la tua finestra commerciale (C3) e l'incremento dei ricavi (C6) siano il più forti possibile per compensare.", "green": "Forte crescita del mercato — assicurati che il tuo piano commerciale sia pronto a coglierla prima che i concorrenti si muovano."}, "C3": {"red": "La tua finestra competitiva è troppo breve per recuperare l'investimento. Rifletti su cosa potrebbe estendere l'esclusiva di mercato: rivendicazioni più ampie, segreti commerciali, barriere regolamentari.", "yellow": "Una finestra di 2 anni è stretta. Lavora sulla creazione di costi di switching, relazioni con i clienti e innovazioni successive per estenderla.", "green": "Una finestra competitiva solida. Usala attivamente — la finestra non rimarrà aperta per sempre."}, "C6": {"red": "Il brevetto sta generando pochissimo incremento commerciale. Rivedi se la tecnologia è genuinamente differenziata agli occhi dei clienti.", "yellow": "L'incremento dei ricavi è gestibile ma modesto. Investi nella validazione commerciale — i clienti sono effettivamente disposti a pagare un premio?", "green": "Forte impatto commerciale. Capitalizzalo attraverso la strategia di prezzo e un focus attivo sulle vendite che valorizzi i benefici abilitati dal brevetto."}, "D1": {"red": "Questo brevetto protegge pochi ricavi centrali. Il caso economico per mantenerlo è debole a meno che gli altri parametri non siano eccezionali.", "yellow": "Il brevetto protegge circa la metà dei tuoi ricavi — una dipendenza significativa ma non critica. Considera di ristrutturare le operazioni per aumentare la dipendenza dalla tecnologia brevettata.", "green": "Il brevetto protegge il cuore della tua attività. Questo è un forte argomento per investire nella sua difesa ed estensione."}, "D2": {"red": "I costi di sviluppo residui sono molto elevati e danneggeranno gravemente il VAN. Cerca finanziamenti (bandi, crediti fiscali R&S) e delimita rigorosamente ciò che è strettamente necessario.", "yellow": "Costi residui moderati. Richiedi incentivi R&S e regimi Patent Box fiscali ove disponibili — possono ridurre significativamente il costo effettivo.", "green": "Costi residui bassi. Assicurati che lo sviluppo rimanga nei tempi e nel budget per preservare questo vantaggio."}, "D3": {"red": "La produzione diventa significativamente più costosa. Esplora miglioramenti di processo, automazione o esternalizzazione per ridurre l'impatto sui costi prima del lancio.", "yellow": "Posizione di costo neutrale. Cerca opportunità di trasformare questo in un vantaggio di costo attraverso l'ottimizzazione dei processi.", "green": "La tecnologia ti rende più efficiente — rendilo parte della tua storia commerciale, poiché costi più bassi significano prezzi più competitivi o margini più alti."}, "D4": {"red": "Il fabbisogno di capitale aggiuntivo al lancio è elevato. Esplora leasing, rollout graduale o produzione in conto terzi per ridurre l'esborso iniziale.", "yellow": "Investimento neutro. Nessun onere extra, ma nemmeno risparmio — cerca opportunità per ridurre l'impronta di capitale.", "green": "Minori fabbisogni di capitale liberano risorse. Usa questa flessibilità finanziaria per rafforzare altre parti del piano aziendale."}};


function updateResults(){
  readSetup();
  var npv=calcNPV();
  var tgt=inputs.bt>0?(inputs.bt*inputs.targetPct/100):0;
  var pct=tgt>0?Math.round(npv/tgt*100):0;
  var barPct=Math.min(pct,120);
  document.getElementById('res-npv-val').textContent=inputs.bt>0?fmtEur(npv):'—';
  document.getElementById('res-tgt-lbl').textContent="Obiettivo: "+(inputs.bt>0?fmtEur(tgt):'—');
  var fill=document.getElementById('res-bar-fill');
  fill.style.width=barPct+'%';
  fill.style.background=pct>=100?'var(--green)':pct>=80?'var(--yellow)':'var(--red)';
  var verdict='';
  if(!inputs.bt){verdict="Inserisci il fatturato aziendale e l'obiettivo nella pagina di configurazione per vedere il risultato.";}
  else if(pct>=100){verdict="<strong>&#10003; Obiettivo raggiunto.</strong> Il profilo dei parametri corrente supporta un VAN pari o superiore all'obiettivo. Concentrati sul mantenere questa posizione — proteggi la tecnologia, fai valere il brevetto ed esegui il piano commerciale.";}
  else if(pct>=80){verdict='<strong>&#9888; Quasi raggiunto — {pct}% dell\'obiettivo.</strong> Sei vicino. Una o due migliorie mirate sui parametri più deboli dovrebbero colmare il divario. Vedi le azioni prioritarie qui sotto.'.replace('{pct}',pct);}
  else if(pct>=50){verdict='<strong>&#9888; A metà strada — {pct}% dell\'obiettivo.</strong> Diversi parametri necessitano di rafforzamento. Il gap del VAN è reale ma colmabile. Prioritizza gli elementi in rosso qui sotto.'.replace('{pct}',pct);}
  else{verdict='<strong>&#10060; Gap significativo — {pct}% dell\'obiettivo.</strong> Il profilo attuale è molto distante dall\'obiettivo. Sono necessari cambiamenti importanti in più parametri prima che il brevetto possa giustificare il suo obiettivo commerciale.'.replace('{pct}',pct);}
  document.getElementById('res-verdict').innerHTML=verdict;
  document.getElementById('res-bar-lbl').textContent='Sei al {pct}% del tuo obiettivo'.replace('{pct}',pct);

  // Parameter grid
  var pg=document.getElementById('param-grid'); pg.innerHTML='';
  var reds=[],yellows=[];
  Object.keys(PARAM_META).forEach(function(id){
    var score=oekScores[id], color=COLORS[id][score-1];
    var m=PARAM_META[id];
    var icon=color==='green'?'&#9989;':color==='yellow'?'&#9888;&#65039;':'&#10060;';
    var badgeCls='badge-'+color;
    var tip=PARAM_TIPS[id]?PARAM_TIPS[id][color]:'';
    var html='<div class="param-card">'
      +'<div class="param-head">'
      +'<span class="param-icon">'+m.icon+'</span>'
      +'<span class="param-name">'+m.name+'</span>'
      +'<span class="param-badge '+badgeCls+'">'+icon+' Punteggio '+score+'</span>'
      +'</div>'
      +'<div class="param-tip">'+tip+'</div>'
      +'</div>';
    pg.innerHTML+=html;
    if(color==='red') reds.push({id:id,score:score,name:m.name,tip:PARAM_TIPS[id].red});
    else if(color==='yellow') yellows.push({id:id,score:score,name:m.name,tip:PARAM_TIPS[id].yellow});
  });

  // Qualitative result
  var legalScore=qualScores.Ag+qualScores.Al+qualScores.Ab+qualScores.Ac;
  var stratScore=qualScores.Ec+qualScores.Es;
  var legalStatus=legalScore>=10?{icon:'&#9989;',color:'#16a34a',label:"Protezione legale solida"}:legalScore>=7?{icon:'&#9888;&#65039;',color:'#d97706',label:"Adeguata — con qualche lacuna"}:{icon:'&#10060;',color:'#dc2626',label:"Richiede attenzione"};
  var stratStatus=stratScore>=5?{icon:'&#9989;',color:'#16a34a',label:"Ben allineato con la strategia"}:stratScore>=4?{icon:'&#9888;&#65039;',color:'#d97706',label:"Parzialmente allineato"}:{icon:'&#10060;',color:'#dc2626',label:"Allineamento strategico assente"};
  var legalRec=legalScore<7?"Lavora sullo stato di concessione del brevetto, la vita residua, la copertura geografica e l'ampiezza delle rivendicazioni per costruire una solida base legale che possa effettivamente proteggere il VAN che stai puntando.":legalScore<10?"La posizione legale è adeguata ma presenta lacune. Prioritizza l'elemento legale più debole (copertura o applicabilità) per ridurre il rischio di perdere inaspettatamente la tua finestra competitiva.":"La tua base legale è solida. Continua a monitorare per violazioni e rivaluta la copertura ogni 2&ndash;3 anni.";
  var stratRec=stratScore<4?"Un brevetto senza un piano commerciale chiaro raramente raggiunge il suo potenziale VAN. Definisci come lo utilizzerai: vendita diretta, licenza o posizionamento difensivo — e integralo nel tuo piano aziendale annuale.":stratScore<5?"La tua strategia è parzialmente in atto. Formalizza il piano commerciale e assicurati che la leadership si impegni a utilizzare attivamente il brevetto.":"Ottimo allineamento strategico. Assicurati che il piano venga rivisto annualmente e resti collegato alle priorità aziendali.";
  document.getElementById('qual-result').innerHTML='<h3>&#9878;&#65039; Fondamenta Legale e Strategica</h3>'
    +'<div class="qual-row"><div class="qual-dot" style="background:'+legalStatus.color+'"></div><div><strong>Protezione legale: '+legalStatus.icon+' '+legalStatus.label+'</strong><br>'+legalRec+'</div></div>'
    +'<div class="qual-row"><div class="qual-dot" style="background:'+stratStatus.color+'"></div><div><strong>Allineamento strategico: '+stratStatus.icon+' '+stratStatus.label+'</strong><br>'+stratRec+'</div></div>';

  // Actions
  var actions=[].concat(reds,yellows).slice(0,4);
  var al=document.getElementById('actions-list');
  if(actions.length===0){
    al.innerHTML='<div class="action-item"><div class="action-num">&#10003;</div><div class="action-text">Tutti i parametri chiave sono nella zona verde. Mantieni la posizione attuale, fai valere il brevetto attivamente ed esegui il piano commerciale.</div></div>';
  } else {
    al.innerHTML=actions.map(function(a,i){
      return '<div class="action-item"><div class="action-num">'+(i+1)+'</div><div class="action-text"><strong>'+a.name+'</strong> (punteggio attuale: {score}): '.replace('{score}',a.score)+a.tip+'</div></div>';
    }).join('');
  }

  updateNPVBar();
}
