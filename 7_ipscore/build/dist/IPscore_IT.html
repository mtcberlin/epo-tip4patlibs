<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPscore 3.0 — EPO · Valutazione Economica del Brevetto</title>
<style>
:root{--navy:#1a2744;--blue:#2563eb;--orange:#f97316;--light:#f8fafc;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;--yellow:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
header .brand{font-size:1.15rem;font-weight:700;letter-spacing:.5px}
header .sub{font-size:.8rem;opacity:.7;margin-top:2px}
header .badge{background:var(--orange);color:#fff;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
.step-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#94a3b8;cursor:pointer;transition:all .2s}
.step-dot.active{background:var(--blue);border-color:var(--blue);color:#fff}
.step-dot.done{background:var(--navy);border-color:var(--navy);color:#fff}
.step-label{font-size:.68rem;color:#64748b;white-space:nowrap}
.step-sep{width:20px;height:2px;background:var(--border);flex-shrink:0}
.step-sep.done{background:var(--navy)}
.page{display:none;padding:24px 28px 100px;max-width:860px;margin:0 auto}
.page.active{display:block}
.page-title{font-size:1.35rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.page-desc{font-size:.88rem;color:#475569;margin-bottom:20px;line-height:1.5}
.sec-header{background:var(--navy);color:#fff;border-radius:8px 8px 0 0;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:0}
.sec-header .sec-badge{background:var(--orange);color:#fff;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:12px}
.sec-header h2{font-size:1rem;font-weight:700}
.sec-progress{background:#e2e8f0;height:6px;border-radius:0}
.sec-progress-fill{height:6px;background:var(--orange);transition:width .3s}
.sec-score-bar{background:#f8fafc;border:1px solid var(--border);border-top:none;padding:8px 18px;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:.82rem;color:#475569;font-weight:600;border-radius:0 0 0 0}
.q-card{background:#fff;border:1px solid var(--border);border-top:none;padding:18px 18px 12px}
.q-card:last-child{border-radius:0 0 8px 8px;margin-bottom:20px}
.q-num{display:inline-block;background:var(--blue);color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.q-text{font-size:.92rem;font-weight:600;color:var(--navy);margin-bottom:10px}
.radio-group{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.radio-opt{display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);transition:background .15s,border-color .15s}
.radio-opt:hover{background:#f0f6ff;border-color:#93c5fd}
.radio-opt input{margin-top:2px;accent-color:var(--blue);width:16px;height:16px;flex-shrink:0}
.radio-opt .opt-num{font-size:.75rem;font-weight:700;color:var(--orange);min-width:16px}
.radio-opt .opt-text{font-size:.82rem;color:#374151;line-height:1.4}
.radio-opt.selected{background:#eff6ff;border-color:var(--blue)}
.help-btn{background:none;border:1px solid var(--border);color:#64748b;font-size:.72rem;padding:3px 10px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:4px;transition:all .15s}
.help-btn:hover{background:#f0f6ff;border-color:var(--blue);color:var(--blue)}
.help-panel{display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 14px;margin-top:8px;font-size:.8rem;color:#92400e;line-height:1.55}
.help-panel.open{display:block}
.help-panel strong{color:#78350f}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.fin-grid{grid-template-columns:1fr}}
.fin-field{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.fin-label{font-size:.8rem;font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fin-label span{font-size:.7rem;color:#64748b;font-weight:400}
.fin-input{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.92rem;color:#1e293b;transition:border-color .15s}
.fin-input:focus{outline:none;border-color:var(--blue)}
.fin-input.readonly{background:#f1f5f9;color:#475569}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 28px;display:flex;justify-content:space-between;align-items:center;z-index:90}
.nav-info{font-size:.8rem;color:#64748b;font-weight:600}
.btn{padding:9px 24px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-prev{background:#f1f5f9;color:var(--navy);border:1.5px solid var(--border)}
.btn-prev:hover{background:#e2e8f0}
.btn-next{background:var(--blue);color:#fff}
.btn-next:hover{background:#1d4ed8}
.btn-print{background:var(--orange);color:#fff}
.btn-print:hover{background:#ea580c}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:640px){.results-grid{grid-template-columns:1fr}}
.score-card{background:var(--navy);color:#fff;border-radius:10px;padding:22px;text-align:center}
.score-big{font-size:3rem;font-weight:800;color:var(--orange)}
.score-sub{font-size:.85rem;opacity:.8;margin-top:4px}
.score-interp{font-size:.82rem;background:rgba(255,255,255,.12);border-radius:6px;padding:8px 12px;margin-top:12px;line-height:1.4}
.radar-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;justify-content:center;align-items:center}
.sec-bars{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
.sec-bars h3{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-name{font-size:.8rem;color:#374151;width:140px;flex-shrink:0}
.bar-track{flex:1;height:14px;background:#e2e8f0;border-radius:7px;overflow:hidden}
.bar-fill{height:14px;border-radius:7px;transition:width .4s}
.bar-val{font-size:.78rem;font-weight:700;color:var(--navy);width:60px;text-align:right;flex-shrink:0}
.risk-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
.risk-card h3{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:14px}
.risk-row{margin-bottom:14px}
.risk-label{font-size:.8rem;font-weight:600;color:#374151;margin-bottom:6px;display:flex;justify-content:space-between}
.van-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;overflow-x:auto}
.van-card h3{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:14px}
.van-table{width:100%;border-collapse:collapse;font-size:.75rem}
.van-table th{background:var(--navy);color:#fff;padding:6px 8px;text-align:right;white-space:nowrap}
.van-table th:first-child{text-align:left}
.van-table td{padding:5px 8px;border-bottom:1px solid #f1f5f9;text-align:right}
.van-table td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.van-table tr:hover td{background:#f8fafc}
.van-table .total-row td{font-weight:700;background:#f0f6ff;color:var(--navy);border-top:2px solid var(--blue)}
.van-highlight{color:var(--blue);font-weight:700}
.steps-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
.steps-card h3{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:12px}
.step-item{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.step-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0}
.step-icon.info{background:var(--blue)}
.step-icon.warn{background:var(--yellow)}
.step-icon.good{background:var(--green)}
.step-text{font-size:.82rem;color:#374151;line-height:1.5}
.intro-hero{background:linear-gradient(135deg,var(--navy) 0%,#2d4a8a 100%);color:#fff;border-radius:12px;padding:28px;margin-bottom:24px}
.intro-hero h1{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.intro-hero p{font-size:.88rem;opacity:.85;line-height:1.6;margin-bottom:16px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.info-grid{grid-template-columns:1fr}}
.info-field{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.info-field label{display:block;font-size:.78rem;font-weight:700;color:var(--navy);margin-bottom:5px}
.info-field input,.info-field textarea{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 11px;font-size:.88rem;color:#1e293b;font-family:inherit}
.info-field input:focus,.info-field textarea:focus{outline:none;border-color:var(--blue)}
.features-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:600px){.features-list{grid-template-columns:1fr}}
.feat{background:rgba(255,255,255,.12);border-radius:8px;padding:12px;text-align:center;font-size:.78rem}
.feat .feat-icon{font-size:1.4rem;margin-bottom:4px}
@media print{
  header,#step-bar,.nav-bar,#help-toggle-all{display:none!important}
  .page{display:block!important;padding:10px;page-break-after:always}
  .page:last-child{page-break-after:avoid}
  .help-panel{display:none!important}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <div><div class="brand">IPscore 3.0 &mdash; Strumento EPO &bull; Adattamento ASP</div><div class="sub">Valutazione qualitativa ed economica del brevetto · European Patent Office</div></div>
  <div class="badge">TOOL INTERATTIVO</div>
</header>
<div class="step-bar" id="step-bar"></div>

<div id="pages"></div>
<div class="nav-bar">
  <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">&#8592; Precedente</button>

</div>
<script>
var cur = 0;
var NPAGE = 8;

var STD5 = ["No", "In misura ridotta", "In qualche misura", "In larga misura", "In grandissima misura"];

var QS = [{"id": "A1", "sec": "A", "t": "Qual è lo stato del brevetto?", "opts": ["Brevetto non ancora depositato", "Domanda di brevetto depositata", "Ricerca di anteriorità e valutazione di brevettabilità completate", "Brevetto concesso", "Periodo di opposizione scaduto senza opposizioni"], "h": "<strong>Perché conta:</strong> Un brevetto in fase di domanda ha ancora incertezza sulla concessione; un brevetto concesso offre piena protezione. <strong>Iter in Europa (EPO):</strong> dalla domanda alla concessione passano mediamente 3–5 anni. <strong>Consiglio:</strong> se siete ancora in fase di domanda, considerate il punteggio in ottica futura una volta concesso.", "oek": null, "risk": 1, "opp": 0}, {"id": "A2", "sec": "A", "t": "Qual è la solidità giuridica del brevetto?", "opts": ["Nessuna ricerca di anteriorità effettuata", "Ricerca rapida ('quick & dirty') effettuata su database pubblici", "Ricerca di anteriorità presso un ufficio nazionale", "Ricerca internazionale (ISR/PCT) effettuata", "Ricerca di anteriorità e ricerca di contraffazione completa"], "h": "<strong>Cosa misura:</strong> quanto il brevetto è difendibile in caso di contestazione. <strong>Benchmark italiano:</strong> una ricerca professionale completa (anteriorità + contraffazione) costa €3.000–€8.000 ma aumenta significativamente il valore legale del brevetto. <strong>PCT:</strong> la ricerca internazionale PCT è lo standard per brevetti multi-paese.", "oek": null, "risk": 1, "opp": 0}, {"id": "A3", "sec": "A", "t": "Per quanto tempo è ancora valido il brevetto?", "opts": ["0–2 anni di vita residua", "2–4 anni di vita residua", "4–8 anni di vita residua", "8–12 anni di vita residua", "Oltre 12 anni di vita residua"], "h": "<strong>Durata massima:</strong> 20 anni dalla data di deposito (art. 60 CPI). <strong>Eccezione farmaceutica:</strong> il Certificato Complementare di Protezione (CCP) può estendere la tutela fino a 5 anni extra. <strong>Tasse annuali EPO:</strong> crescono da ~€500 (anno 3) a ~€1.800+ (anno 10+); considerare se il rinnovo è economicamente sostenibile.", "oek": null, "risk": 1, "opp": 1}, {"id": "A4", "sec": "A", "t": "Quanto sono ampie e inclusive le rivendicazioni del brevetto?", "opts": ["Rivendicazioni molto strette e specifiche", "Rivendicazioni abbastanza strette", "Rivendicazioni ragionevolmente ampie", "Rivendicazioni ampiamente inclusive", "Le rivendicazioni riguardano un principio generale (tecnologia di base)"], "h": "<strong>Cosa sono le rivendicazioni:</strong> definiscono lo spazio di monopolio legale. Più sono ampie, più difficile per i concorrenti aggirarle. <strong>Trade-off:</strong> rivendicazioni troppo ampie possono essere invalidate per mancanza di base nella descrizione. <strong>Strategia consigliata:</strong> strutturare in rivendicazione principale ampia + rivendicazioni dipendenti di fall-back.", "oek": null, "risk": 0, "opp": 1}, {"id": "A5", "sec": "A", "t": "La copertura geografica del brevetto include i mercati rilevanti?", "opts": ["Protezione in un singolo mercato nazionale", "Protezione in pochi paesi del mercato di riferimento", "Protezione nella maggior parte dei paesi rilevanti", "Protezione in tutti i paesi del mercato attuale", "Protezione in tutti i paesi attuali e potenzialmente rilevanti"], "h": "<strong>Costi orientativi:</strong> brevetto europeo (EPC) con validazione in 5 paesi ≈ €15.000–€25.000 totali nei 10 anni; PCT globale molto di più. <strong>Paesi prioritari per le PMI italiane:</strong> DE, FR, GB, US, CN sono spesso i mercati più critici. <strong>Consiglio:</strong> coprire almeno i paesi dei principali clienti e dei concorrenti più pericolosi.", "oek": null, "risk": 1, "opp": 1}, {"id": "A6", "sec": "A", "t": "Il brevetto viene monitorato per identificare eventuali violazioni?", "opts": ["Nessun monitoraggio contro le contraffazioni", "Monitoraggio casuale tramite segnalazioni commerciali", "Monitoraggio sistematico parziale di prodotti concorrenti selezionati", "Monitoraggio sistematico dei mercati rilevanti", "Monitoraggio globale formalizzato con watchdog dedicato"], "h": "<strong>Strumenti disponibili:</strong> alert automatici su Espacenet/USPTO, servizi di watch brevettuale (€500–€3.000/anno). <strong>Perché è importante:</strong> senza monitoraggio, le violazioni non vengono rilevate e il brevetto perde valore pratico. <strong>Per PMI:</strong> anche un monitoraggio annuale manuale dei principali concorrenti è meglio di nulla.", "oek": null, "risk": 1, "opp": 0}, {"id": "A7", "sec": "A", "t": "Sono frequenti controversie legali nei mercati operativi?", "opts": ["Procedimenti legali molto frequenti nel settore", "Procedimenti legali presenti nel settore", "Controversie (pre-contenziosi) frequenti nel settore", "Controversie occasionali", "Controversie e procedimenti legali non abituali nel settore"], "h": "<strong>Nota contro-intuitiva:</strong> un settore litigioso abbassa il punteggio perché difendere il brevetto è costoso e rischioso. <strong>Benchmark:</strong> settori ad alto contenzioso: farmaceutico, ICT/software, semiconduttori. Settori a basso contenzioso: molti settori manifatturieri tradizionali italiani. <strong>Costi di un contenzioso:</strong> un'azione legale brevettuale in Italia può costare €50.000–€300.000.", "oek": null, "risk": 1, "opp": 0}, {"id": "A8", "sec": "A", "t": "L'azienda ha i mezzi per far rispettare i diritti brevettuali?", "opts": ["Generalmente troppo costoso e difficile far valere i diritti", "Diritti difesi solo in paesi selezionati nei mercati principali", "Diritti difesi nei confronti di concorrenti selezionati", "Diritti difesi in quasi tutti i casi se non troppo costoso", "I diritti brevettuali vengono sempre difesi"], "h": "<strong>Alternative al contenzioso classico:</strong> la mediazione brevettuale (WIPO) o le clausole di arbitrato nei contratti possono ridurre i costi. <strong>Assicurazione brevettuale:</strong> prodotti come \"Patent Insurance\" (es. Arag, DAS) coprono parte dei costi legali — premi da €2.000–€10.000/anno. <strong>Per piccole aziende:</strong> valutare partnership con studi legali specializzati a quota di successo.", "oek": null, "risk": 1, "opp": 0}, {"id": "B1", "sec": "B", "t": "L'invenzione è una tecnologia unica nel suo campo?", "opts": ["L'invenzione ha un effetto marginale rispetto alla tecnologia esistente", "L'invenzione ha qualche miglioramento rispetto all'esistente", "L'invenzione ha un miglioramento significativo rispetto all'esistente", "L'invenzione ha un miglioramento sostanziale ed è chiaramente innovativa", "L'invenzione può cambiare il modo in cui il settore opera"], "h": "<strong>Come valutare:</strong> confrontare con lo stato dell'arte al momento del deposito. <strong>Segnali di alta unicità:</strong> assenza di prior art simile, pubblicazioni scientifiche che la citano, interesse di grandi aziende all'acquisto o licensing. <strong>Consiglio:</strong> richiedere un FTO (Freedom to Operate) analysis per identificare eventuali brevetti bloccanti (costo €3.000–€8.000).", "oek": null, "risk": 0, "opp": 1}, {"id": "B2", "sec": "B", "t": "L'invenzione è tecnicamente superiore alle tecnologie sostitutive?", "opts": ["La tecnologia opera in un campo dominato da tecnologie sostitutive nuove e più avanzate", "Esiste un'ampia gamma di tecnologie sostitutive abbastanza competitive", "Esistono tecnologie sostitutive ma limitate nell'uso e nell'applicazione", "Esistono tecnologie sostitutive ma non ancora competitive", "Non esistono tecnologie sostitutive note"], "h": "<strong>Cosa sono le tecnologie sostitutive:</strong> soluzioni diverse che risolvono lo stesso problema (es. streaming vs. DVD). <strong>Esempio italiano:</strong> una macchina di packaging brevettata affronta la \"minaccia\" di soluzioni manuali o di processi completamente diversi. <strong>Analisi consigliata:</strong> mappare le alternative tecnologiche sul mercato e valutarne la maturità.", "oek": null, "risk": 1, "opp": 1}, {"id": "B3", "sec": "B", "t": "In che misura l'invenzione è stata testata?", "opts": ["L'invenzione è stata testata solo in teoria (calcoli/simulazioni)", "Sono stati effettuati esperimenti o test isolati", "Test di produzione completati con successo", "Produzione in fase di avviamento (ramp-up)", "Produzione a piena scala già operativa"], "h": "<strong>Perché conta:</strong> il grado di maturità tecnologica (TRL - Technology Readiness Level) influenza direttamente il rischio commerciale. <strong>TRL corrispondente:</strong> 1=TRL 1-3, 2=TRL 4, 3=TRL 5-6, 4=TRL 7-8, 5=TRL 9. <strong>Per i finanziatori:</strong> i bandi MISE/MUR e Horizon Europe valutano spesso il TRL come requisito minimo.", "oek": null, "risk": 1, "opp": 0}, {"id": "B4", "sec": "B", "t": "La tecnologia brevettata richiede nuove competenze o attrezzature produttive?", "opts": ["Richiede un processo produttivo completamente nuovo da zero", "Sviluppo sostanziale dei processi produttivi necessario prima di poterla utilizzare", "Qualche sviluppo dei processi produttivi necessario", "Solo lievi adattamenti necessari ai processi esistenti", "Può essere utilizzata con la tecnologia produttiva attuale senza modifiche"], "h": "<strong>Impatto sui costi:</strong> un processo completamente nuovo può richiedere €100K–€2M+ in investimenti. <strong>Agevolazioni disponibili:</strong> Industria 4.0 (iper-ammortamento 250% su beni tecnologici), bandi Simest/SACE per internazionalizzazione. <strong>Suggerimento:</strong> valutare contratti di produzione in conto terzi (terzisti) per ridurre l'investimento iniziale.", "oek": null, "risk": 1, "opp": 0}, {"id": "B5", "sec": "B", "t": "Quanto tempo è necessario prima che la tecnologia possa essere commercializzata?", "opts": ["5 anni prima della commercializzazione [valore: 5]", "2 anni [valore: 2]", "1 anno [valore: 1]", "6 mesi [valore: 0,5]", "Pronta per le attività commerciali — 0 anni [valore: 0]"], "h": "<strong>Questo valore viene usato nel calcolo VAN:</strong> sposta in avanti l'orizzonte dei ricavi e riduce il valore attuale netto. <strong>Componenti tipiche del tempo:</strong> sviluppo prodotto, certificazioni (CE, ISO), approvazioni regolatorie (AIFA per farmaci), scaling produttivo. <strong>Consiglio:</strong> agire sul time-to-market è spesso il miglior investimento per massimizzare il VAN.", "oek": [5, 2, 1, 0.5, 0], "risk": 1, "opp": 0}, {"id": "B6", "sec": "B", "t": "I prodotti contraffattori sono facili da produrre da parte dei concorrenti?", "opts": ["La tecnologia è facilmente identificabile, facile da copiare e riprodurre", "La tecnologia è facile da copiare e produrre", "La tecnologia è comparativamente facile da identificare, copiare e produrre", "La tecnologia è complessa e difficile da copiare e produrre", "La tecnologia è complessa ed estremamente difficile da copiare e produrre"], "h": "<strong>Strategie di protezione aggiuntive:</strong> segreto industriale complementare al brevetto, complessità tecnica intrinseca, supply chain esclusiva. <strong>Esempio positivo:</strong> tecnologie che richiedono materiali speciali, processi ad alta precisione o know-how tacito difficile da replicare. <strong>Nota legale:</strong> il know-how non brevettato è protetto dall'art. 98-99 CPI come segreto commerciale.", "oek": null, "risk": 1, "opp": 0}, {"id": "B7", "sec": "B", "t": "I prodotti contraffattori sono facili da identificare?", "opts": ["È estremamente difficile identificare prodotti contraffattori", "È difficile ma non impossibile identificare prodotti contraffattori", "È abbastanza facile identificare prodotti contraffattori", "È facile identificare prodotti contraffattori", "È estremamente facile identificare prodotti contraffattori"], "h": "<strong>Perché importa:</strong> se la violazione è facilmente rilevabile, i concorrenti sono più deterriti e il brevetto vale di più in pratica. <strong>Strumenti di rilevamento:</strong> analisi chimica/spettroscopica, ingegneria inversa, confronto visivo/funzionale, monitoraggio fiere e cataloghi. <strong>Settori a bassa rilevabilità:</strong> processi chimici intermedi, software, metodi di business.", "oek": null, "risk": 1, "opp": 0}, {"id": "B8", "sec": "B", "t": "Il deployment della tecnologia dipende da accordi di licenza con terzi?", "opts": ["L'uso del brevetto dipende da accordi di licenza estesi con concorrenti", "L'uso dipende da alcune licenze con concorrenti", "L'uso non dipende da licenze particolari con concorrenti", "Licenze necessarie ma non con concorrenti diretti", "L'uso del brevetto è completamente indipendente da accordi di licenza"], "h": "<strong>Patent thicket:</strong> in settori come ICT e farmaceutica, è comune che una tecnologia richieda licenze da decine di brevetti di terzi. <strong>FRAND:</strong> i brevetti essenziali agli standard (SEP) devono essere licenziati a condizioni Fair, Reasonable and Non-Discriminatory. <strong>Consiglio:</strong> verificare tramite FTO analysis la necessità di in-licensing prima di investire in sviluppo prodotto.", "oek": null, "risk": 1, "opp": 0}, {"id": "B9", "sec": "B", "t": "La tecnologia ha valore di marketing verso i clienti (customer value)?", "opts": ["Il brevetto fornisce un miglioramento dell'utilità del prodotto molto difficile da comunicare ai clienti", "Miglioramento difficile da comunicare", "Il brevetto fornisce un miglioramento comunicabile dell'utilità del prodotto", "Miglioramento lieve ma facile da comunicare", "Il brevetto fornisce caratteristiche distintive utilizzabili attivamente nel marketing"], "h": "<strong>Il marchio ® vs il brevetto™:</strong> il brevetto tutela la tecnologia, ma il suo valore di marketing si materializza quando diventa un differenziatore percepito dal cliente. <strong>Esempi di alta comunicabilità:</strong> \"motore brevettato 30% più efficiente\", \"materiale brevettato 2x più resistente\". <strong>Integrazione strategica:</strong> combinare il brevetto con design registrato e marchio per una protezione IP completa.", "oek": null, "risk": 0, "opp": 1}, {"id": "C1", "sec": "C", "t": "Quali sono le opzioni di commercializzazione della tecnologia?", "opts": ["Non esiste un mercato noto per la tecnologia brevettata", "La tecnologia non è ancora stata indirizzata a un mercato specifico", "Esiste un mercato consolidato per la tecnologia", "Esiste un mercato consolidato con ulteriori opzioni di mercato ben definite", "Esiste un mercato consolidato con altri mercati emergenti e tangibili"], "h": "<strong>Canali di commercializzazione:</strong> vendita diretta, licensing, franchising tecnologico, joint venture, spin-off. <strong>Market sizing Italia:</strong> valutare TAM (mercato totale), SAM (raggiungibile), SOM (obiettivo realistico). <strong>Supporto disponibile:</strong> Invitalia, CDP Venture Capital, network EEN (Enterprise Europe Network) per trovare partner commerciali internazionali.", "oek": null, "risk": 1, "opp": 1}, {"id": "C2", "sec": "C", "t": "Qual è la crescita del mercato nell'area di business dove viene utilizzata la tecnologia?", "opts": ["Molto bassa: 0,5% annuo [valore: 0,005]", "Bassa: 2,5% annuo [valore: 0,025]", "Media: 5% annuo [valore: 0,05]", "Alta: 8% annuo [valore: 0,08]", "Molto alta: 15% annuo [valore: 0,15]"], "h": "<strong>Questo valore entra nel calcolo VAN</strong> come tasso di crescita del fatturato dell'area di business. <strong>Benchmark Italia 2024:</strong> manifatturiero tradizionale 1-3%, medicale/pharma 5-8%, cleantech/rinnovabili 8-15%, AI/digitale 10-20%. <strong>Fonte suggerita:</strong> report ISTAT, Federazioni di settore (Confindustria), Eurostat, rapporti di mercato IBISWorld/Statista.", "oek": [0.005, 0.025, 0.05, 0.08, 0.15], "risk": 0, "opp": 1}, {"id": "C3", "sec": "C", "t": "Qual è la vita attesa della tecnologia nel mercato dopo la commercializzazione?", "opts": ["6 mesi [valore: 0,5]", "1 anno [valore: 1]", "2 anni [valore: 2]", "4 anni [valore: 4]", "8 anni [valore: 8]"], "h": "<strong>Questo valore entra nel calcolo VAN</strong> come orizzonte dei flussi di cassa aggiuntivi. <strong>Fattori che riducono la vita di mercato:</strong> rapida obsolescenza tecnologica, forte concorrenza, cambi normativi. <strong>Fattori che la allungano:</strong> standard di settore, elevati costi di switching per i clienti, ecosistemi proprietari. <strong>Nota:</strong> la vita di mercato può essere minore della durata residua del brevetto.", "oek": [0.5, 1, 2, 4, 8], "risk": 0, "opp": 1}, {"id": "C4", "sec": "C", "t": "Esistono prodotti competitivi o sostitutivi attivi nel mercato?", "opts": ["Alto grado di sviluppo di tecnologie competitive o sostitutive in corso", "È probabile che tecnologie competitive o sostitutive vengano sviluppate", "50% di probabilità che tecnologie competitive vengano sviluppate", "Buona probabilità di mantenere l'esclusività nel mercato", "L'esclusività nel mercato è praticamente certa"], "h": "<strong>Analisi della concorrenza:</strong> monitorare i brevetti dei concorrenti su Espacenet e Google Patents per anticipare nuovi entranti. <strong>Barriere all'ingresso:</strong> elevati investimenti R&D, knowledge tacito, economie di scala, effetti rete rendono più difficile la sostituzione. <strong>Settori ad alta sostituzione:</strong> app mobile, soluzioni SaaS, componenti elettronici commoditizzati. <strong>Settori a bassa sostituzione:</strong> macchinari industriali specializzati, processi chimici complessi, dispositivi medici certificati.", "oek": null, "risk": 1, "opp": 1}, {"id": "C5", "sec": "C", "t": "Quale prezzo finale il consumatore è disposto a pagare rispetto a prodotti già noti?", "opts": ["Prezzo raggiungibile significativamente inferiore a quello dei concorrenti", "Inferiore a quello dei concorrenti", "Uguale a quello dei concorrenti", "Superiore a quello dei concorrenti", "Significativamente superiore a quello dei concorrenti"], "h": "<strong>Pricing power:</strong> un brevetto che consente di praticare prezzi premium è il segno più diretto di valore economico. <strong>Come stimarlo:</strong> ricerche di mercato, conjoint analysis, test A/B su campioni di clienti, confronto con prodotti sostitutivi. <strong>Esempio:</strong> un dispositivo medico brevettato con efficacia clinica superiore può giustificare un premium del 30–100% rispetto all'alternative generica.", "oek": null, "risk": 0, "opp": 1}, {"id": "C6", "sec": "C", "t": "Qual è il potenziale incremento del fatturato nell'area di business grazie alla tecnologia brevettata?", "opts": ["Incremento molto piccolo: 0,5% del fatturato dell'area [valore: 0,005]", "Piccolo: 2% [valore: 0,02]", "Medio: 4% [valore: 0,04]", "Grande: 6% [valore: 0,06]", "Molto grande: 10% [valore: 0,1]"], "h": "<strong>Questo valore entra direttamente nel calcolo VAN</strong> come percentuale di incremento del fatturato nell'area di business grazie al brevetto. <strong>Come stimarlo:</strong> analisi storica di lanci simili nel settore, ricerche di mercato, pilota commerciale. <strong>Per PMI manifatturiere italiane:</strong> un incremento del 4–6% su un fatturato di €1M genera €40K–€60K di fatturato aggiuntivo annuo.", "oek": [0.005, 0.02, 0.04, 0.06, 0.1], "risk": 0, "opp": 1}, {"id": "C7", "sec": "C", "t": "Quale conoscenza ha l'azienda del potenziale applicativo e delle opportunità commerciali?", "opts": ["Conoscenza limitata solo all'applicazione primaria", "Scarsa conoscenza del potenziale applicativo e commerciale", "Buona conoscenza del potenziale applicativo, scarsa conoscenza commerciale", "Buona conoscenza sia del potenziale applicativo sia delle opportunità commerciali", "Conoscenza completa di tutte le applicazioni e opportunità commerciali, incluse quelle non tradizionali"], "h": "<strong>Come migliorare questo punteggio:</strong> analisi settoriale cross-industry, partecipazione a fiere tecnologiche, scouting con partner EEN. <strong>Applicazioni non ovvie:</strong> molte tecnologie hanno usi in settori distanti da quello originario — questo espande significativamente il valore del brevetto. <strong>Strumento utile:</strong> Technology Intelligence Report da istituti come Fraunhofer o CNR-IBIMET.", "oek": null, "risk": 0, "opp": 1}, {"id": "C8", "sec": "C", "t": "La tecnologia brevettata ha potenziale per generare ricavi da accordi di licenza?", "opts": ["Nessuna prospettiva rilevante di ricavi da licenze", "Ricavi da licenze possibili in misura ridotta", "Buone prospettive/potenziale di ricavi da accordi di licenza", "Ottime prospettive di ricavi da licenze", "Eccellenti prospettive: possibilità di licenze multiple o standard di settore"], "h": "<strong>Royalty tipiche per settore:</strong> farmaceutico 5–20%, meccanica 2–5%, software 5–15%, chimico 3–8%. <strong>Piattaforme di licensing:</strong> IPH, LOT Network, Dennemeyer Consulting, IAM Market per trovare licenziatari. <strong>Strategia di patent pool:</strong> in settori come IoT, automotive, e-health, entrare in patent pool può garantire ricavi passivi continuativi.", "oek": null, "risk": 0, "opp": 1}, {"id": "C9", "sec": "C", "t": "Le attività commerciali richiedono autorizzazioni speciali da enti pubblici o simili?", "opts": ["Autorizzazione necessaria — già rifiutata dall'autorità pubblica", "Domanda non ancora presentata o provvisoriamente rifiutata", "Domanda presentata alle autorità — risposta in attesa", "Autorizzazione a termine approvata dall'autorità pubblica", "Autorizzazione permanente ottenuta, oppure nessuna autorizzazione richiesta per commercializzare"], "h": "<strong>Settori con autorizzazioni critiche:</strong> farmaceutico (AIFA, EMA), dispositivi medici (CE mark, classe IIa–III), alimentare (EFSA), energia (GSE), chimico (REACH). <strong>Tempi tipici:</strong> device medico classe II: 12–24 mesi; farmaco nuovo: 5–10 anni; prodotto alimentare funzionale: 2–4 anni. <strong>Consiglio:</strong> avviare le pratiche autorizzative in parallelo allo sviluppo tecnologico per ridurre il time-to-market.", "oek": null, "risk": 1, "opp": 0}, {"id": "D1", "sec": "D", "t": "L'output attuale dell'area di business può essere mantenuto senza la tecnologia brevettata?", "opts": ["100% dell'output può essere mantenuto senza il brevetto [valore: 1]", "75% dell'output può essere mantenuto [valore: 0,75]", "50% dell'output può essere mantenuto [valore: 0,5]", "25% dell'output può essere mantenuto [valore: 0,25]", "0% — l'azienda dipende completamente dalla tecnologia brevettata [valore: 0]"], "h": "<strong>Questo valore entra nel calcolo VAN:</strong> quanto più basso è (più dipendenza), tanto maggiori sono i \"ricavi recuperati\" attribuibili al brevetto. <strong>Interpretazione:</strong> se il brevetto protegge un componente critico di un prodotto core, il punteggio 5 (dipendenza totale) massimizza il valore VAN calcolato. <strong>Consiglio:</strong> essere conservativi nella stima — sopravvalutare la dipendenza gonfia il VAN artificialmente.", "oek": [1, 0.75, 0.5, 0.25, 0], "risk": 0, "opp": 0}, {"id": "D2", "sec": "D", "t": "Quali sono i costi futuri di sviluppo necessari prima della commercializzazione?", "opts": ["Investimento estremamente elevato: 30% del fatturato dell'area di business [0,3]", "Molto elevato: 15% [0,15]", "Alto: 8% [0,08]", "Medio: 2,5% [0,025]", "Basso: 0,5% [0,005]"], "h": "<strong>Questo valore entra nel calcolo VAN</strong> come costo annuo di sviluppo prima della commercializzazione. <strong>Cosa includere:</strong> costi R&D residui, costi di brevettazione (deposito, esame, validazione), costi di certificazione e market entry. <strong>Incentivi disponibili:</strong> credito d'imposta R&S (20% costi ammissibili), Patent Box (detassazione al 50% dei redditi da brevetti), bandi PNRR.", "oek": [0.3, 0.15, 0.08, 0.025, 0.005], "risk": 1, "opp": 0}, {"id": "D3", "sec": "D", "t": "Qual è l'indice dei costi di produzione implementando la tecnologia brevettata?", "opts": ["Aumento del 30% dei costi produttivi rispetto al livello attuale [1,3]", "Aumento del 15% [1,15]", "Nessuna variazione rispetto ai costi attuali [1,0]", "Riduzione del 15% [0,85]", "Riduzione del 30% [0,7]"], "h": "<strong>Questo valore entra nel calcolo VAN</strong> direttamente come moltiplicatore dei costi operativi. <strong>Come stimarlo:</strong> confrontare i costi di produzione unitari con e senza la nuova tecnologia (analisi ABC - Activity Based Costing). <strong>Fonti di riduzione dei costi:</strong> automazione, minori scarti, riduzione tempi ciclo, minori consumi energetici. <strong>Benchmark:</strong> Industria 4.0 può portare a riduzioni dei costi del 10–25% in manifattura.", "oek": [1.3, 1.15, 1, 0.85, 0.7], "risk": 1, "opp": 1}, {"id": "D4", "sec": "D", "t": "Quale investimento è necessario per le attrezzature produttive rispetto al livello attuale?", "opts": ["120% dell'intensità di investimento attuale — richiede investimento aggiuntivo significativo [1,2]", "110% dell'intensità attuale [1,1]", "100% — investimento neutro, uguale all'attuale [1,0]", "70% dell'intensità attuale — risparmio del 30% [0,7]", "50% dell'intensità attuale — risparmio del 50% [0,5]"], "h": "<strong>Questo valore entra nel calcolo VAN</strong> come fattore di intensità dell'investimento in attrezzature produttive. <strong>Come stimarlo:</strong> confrontare il valore degli impianti necessari con il parco macchine attuale. <strong>Leasing e noleggio:</strong> per ridurre l'esborso iniziale, considerare leasing operativo (deducibile al 100% per le imprese italiane) o noleggio a lungo termine. <strong>Fondi agevolati:</strong> Sabatini Plus, SIMEST, fondi BEI tramite banche convenzionate Mediocredito.", "oek": [1.2, 1.1, 1, 0.7, 0.5], "risk": 1, "opp": 0}, {"id": "D5", "sec": "D", "t": "L'azienda ha la capacità finanziaria di coprire le tasse di rinnovo nei mercati rilevanti?", "opts": ["Mantenimento possibile in 1 solo paese", "2–5 paesi", "5–10 paesi", "10–15 paesi", "Oltre 15 paesi / tutti i paesi attuali e potenzialmente rilevanti"], "h": "<strong>Costi di rinnovo orientativi (EPO, per paese):</strong> anni 3–5: €500–€800/anno; anni 6–10: €1.000–€1.500/anno; anni 11–15: €1.500–€2.500/anno. <strong>Strategia di razionalizzazione:</strong> ogni 2–3 anni, verificare se i mercati coperti generano ancora valore commerciale ed eventualmente abbandonare quelli non redditizi. <strong>Servizi di rinnovo:</strong> Dennemeyer Renewals, CPA Global, Anaqua offrono gestione automatizzata dei rinnovi con ottimizzazione dei costi.", "oek": null, "risk": 1, "opp": 0}, {"id": "D6", "sec": "D", "t": "Qual è il contributo stimato della tecnologia brevettata ai profitti aziendali?", "opts": ["Meno del 3% degli utili cumulati", "3–10% degli utili cumulati", "10–15% degli utili cumulati", "15–25% degli utili cumulati", "Oltre il 25% degli utili cumulati"], "h": "<strong>Come stimarlo:</strong> analizzare i margini del prodotto/servizio che usa il brevetto rispetto alla media aziendale. <strong>Patent Box Italia:</strong> i redditi derivanti direttamente dall'utilizzo di brevetti, know-how e design registrati beneficiano di una detassazione del 50% (DL 50/2017 modificato dalla L. 197/2022). <strong>Valutazione IP per bilancio:</strong> brevetti con contributo elevato possono essere iscritti all'attivo dello stato patrimoniale, migliorando i ratios finanziari per accesso al credito.", "oek": null, "risk": 0, "opp": 0}, {"id": "E1", "sec": "E", "t": "L'obiettivo del brevetto è consolidare le posizioni nei mercati esistenti?", "opts": ["No", "In misura ridotta", "In qualche misura", "In larga misura", "In grandissima misura"], "h": "<strong>Strategia difensiva:</strong> i brevetti come barriera d'entrata proteggono le quote di mercato conquistate. <strong>Patent clustering:</strong> un portafoglio di brevetti correlati (\"cluster\" o \"thicket\") rende molto più difficile per i concorrenti aggirare la protezione IP. <strong>Segnale per i clienti:</strong> la capacità di difendere legalmente la tecnologia aumenta la fiducia dei clienti nella continuità della supply.", "oek": null, "risk": 0, "opp": 0}, {"id": "E2", "sec": "E", "t": "L'obiettivo del brevetto è conquistare nuovi mercati?", "opts": ["No", "In misura ridotta", "In qualche misura", "In larga misura", "In grandissima misura"], "h": "<strong>Brevetto come leva di internazionalizzazione:</strong> un brevetto riconosciuto in nuovi mercati geografici o applicativi abbassa il rischio percepito dai potenziali partner locali. <strong>Strategia PCT:</strong> il deposito PCT (Patent Cooperation Treaty) garantisce 30 mesi per decidere in quali paesi procedere, permettendo di valutare le opportunità di mercato prima di sostenere i costi di nazionalizzazione. <strong>SACE/Simest:</strong> supportano l'export tech-based anche tramite voucher e finanziamenti agevolati.", "oek": null, "risk": 0, "opp": 0}, {"id": "E3", "sec": "E", "t": "Il brevetto fa parte di un processo di costruzione dell'immagine aziendale (image building)?", "opts": ["No", "In misura ridotta", "In qualche misura", "In larga misura", "In grandissima misura"], "h": "<strong>Il brevetto come asset di comunicazione:</strong> \"azienda con X brevetti\" comunica innovatività, solidità tecnologica e capacità di investimento in R&D. <strong>Utilizzo nel marketing B2B:</strong> certificazioni, premi innovazione, menzioni in capitolati d'appalto. <strong>Effetto sul credito bancario:</strong> un portafoglio IP documentato migliora il merito creditizio (rating Cerved/CRIF) e può sbloccare finanziamenti agevolati.", "oek": null, "risk": 0, "opp": 0}, {"id": "E4", "sec": "E", "t": "L'obiettivo è garantire la 'libertà operativa' (freedom to operate) per le attività di sviluppo future?", "opts": ["No", "In misura ridotta", "In qualche misura", "In larga misura", "In grandissima misura"], "h": "<strong>Freedom to Operate (FTO):</strong> assicurarsi che le attività di R&D future non violino brevetti altrui — il brevetto difensivo \"occupa lo spazio\" prima dei concorrenti. <strong>Brevetti difensivi:</strong> alcune aziende depositano brevetti non per commercializzarli, ma per impedire ai concorrenti di bloccarle. < var SEC_ORDER = ['A','B','C','D','E'];
var SEC_NAMES = {"A": "A. Stato Legale", "B": "B. Tecnologia", "C": "C. Condizioni di Mercato", "D": "D. Finanza", "E": "E. Strategia"};
var SEC_MAX = {A:40,B:45,C:45,D:30,E:40};
var OEK_QUESTIONS = ['B5','C2','C3','C6','D1','D2','D3','D4'];

function getScores() {
  var s = {};
  QS.forEach(function(q) {
    var sel = document.querySelector('input[name="q_'+q.id+'"]:checked');
    s[q.id] = sel ? parseInt(sel.value) : 0;
  });
  return s;
}

function getOEK(scores) {
  var o = {};
  QS.forEach(function(q) {
    if (q.oek) { o[q.id] = q.oek[scores[q.id]-1] !== undefined ? q.oek[scores[q.id]-1] : 0; }
  });
  return o;
}

function getSecScore(sec, scores) {
  var tot = 0;
  QS.filter(function(q){return q.sec===sec;}).forEach(function(q){tot+=scores[q.id]||0;});
  return tot;
}

function calcRiskOpp(scores) {
  var riskSum = 0, riskMax = 0;
  var oppSum = 0, oppMax = 0;
  QS.forEach(function(q) {
    var v = scores[q.id] || 0;
    if (q.risk) { riskSum += -(5-v)/4; riskMax += 1; }
    if (q.opp) { oppSum += (v-1)/4; oppMax += 1; }
  });
  return {
    risk: riskMax > 0 ? Math.abs(riskSum)/riskMax : 0,
    opp: oppMax > 0 ? oppSum/oppMax : 0
  };
}

function getFin() {
  function v(id) { return parseFloat(document.getElementById(id).value)||0; }
  return {
    turnover: v('fin_turnover'),
    directCosts: v('fin_direct'),
    indirectCosts: v('fin_indirect'),
    depreciation: v('fin_depreciation'),
    deprecPeriod: v('fin_deprecPeriod')||5,
    sectorShare: v('fin_sectorShare'),
    discountRate: v('fin_discount')
  };
}

function calcVAN(fin, oek) {
  if (!fin.turnover || !fin.sectorShare) return {van:0, rows:[]};
  var BT = fin.turnover;
  var DC = fin.directCosts;
  var IC = fin.indirectCosts;
  var DP = fin.depreciation;
  var depPeriod = fin.deprecPeriod;
  var S = fin.sectorShare / 100;
  var discount = (fin.discountRate||10) / 100;
  var shareCosts = BT > 0 ? (DC+IC)/BT : 0;
  var shareDeprec_pct = BT > 0 ? DP/BT*100 : 0;
  var invIndex = BT > 0 ? depPeriod*DP/BT : 0;
  var T = oek['B5'] !== undefined ? oek['B5'] : 2;
  var g = oek['C2'] !== undefined ? oek['C2'] : 0.025;
  var L = oek['C3'] !== undefined ? oek['C3'] : 2;
  var et = oek['C6'] !== undefined ? oek['C6'] : 0.04;
  var D1 = oek['D1'] !== undefined ? oek['D1'] : 0.5;
  var D2 = oek['D2'] !== undefined ? oek['D2'] : 0.08;
  var D3 = oek['D3'] !== undefined ? oek['D3'] : 1.0;
  var D4 = oek['D4'] !== undefined ? oek['D4'] : 1.0;

  function fracYear(y) {
    if (y <= T) return 0;
    if (y-T < 1) return y-T;
    if (y <= T+L) return 1;
    if (y-T-L < 1) return 1-(y-T-L);
    return 0;
  }

  var rev = [0];
  for (var y=1; y<=10; y++) {
    var frac = fracYear(y);
    rev.push(frac * et * Math.pow(1+g,y-1) * S * Math.pow(1+g,y) * 100);
  }

  var yFirst = 0;
  for (var y=1; y<=10; y++) { if (rev[y]>0) { yFirst=y; break; } }

  // Matches Excel 'Financial calculations' rows 98-121: sum revenue over every
  // year y with y>T and y<=T+1+depPeriod (always depPeriod+1 calendar-year
  // slots, not depPeriod), then divide by depPeriod.
  var sumRevNext = 0;
  for (var y=1; y<=10; y++) { if (y>T && y<=T+1+depPeriod) sumRevNext += rev[y]; }
  var avgRev = depPeriod>0 ? sumRevNext/depPeriod : 0;

  var rows = [], van = 0;
  for (var y=1; y<=10; y++) {
    var revenue = rev[y];
    var frac = fracYear(y);
    var devCost = (y<=T) ? D2*S*100 : 0;
    var costs = revenue*D3*shareCosts + devCost;
    var investments = (y===yFirst && yFirst>0) ? avgRev*D4*invIndex : 0;
    var invReduction = (y===yFirst && yFirst>0) ? depPeriod*shareDeprec_pct*(1-D4)*S*Math.pow(1+g,y) : 0;
    var regained = frac*(1-shareCosts)*(1-D1)*S*Math.pow(1+g,y)*100;
    var efficiency = frac*shareCosts*(1-D3)*S*Math.pow(1+g,y)*100;
    var liquidity = revenue - costs - investments + regained + efficiency + invReduction;
    var pv = liquidity * BT/100 / Math.pow(1+discount,y);
    van += pv;
    rows.push({y:y,revenue:revenue,costs:costs,investments:investments,invReduction:invReduction,regained:regained,efficiency:efficiency,liquidity:liquidity,pv:pv});
  }
  return {van:van, rows:rows};
}

function drawRadar(canvas, secScores) {
  var ctx = canvas.getContext('2d');
  canvas.width = 340; canvas.height = 300;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var cx=170, cy=155, R=100;
  var n=5;
  var labels=["A. Legale", "B. Tecnologia", "C. Mercato", "D. Finanza", "E. Strategia"];
  var maxes=[40,45,45,30,40];
  var norms=secScores.map(function(s,i){return maxes[i]>0?s/maxes[i]:0;});

  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  for(var lev=1;lev<=5;lev++){
    var r=R*lev/5;
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var ang=2*Math.PI*i/n-Math.PI/2;
      var x=cx+r*Math.cos(ang), yy=cy+r*Math.sin(ang);
      i===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;
  for(var i=0;i<n;i++){
    var ang=2*Math.PI*i/n-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(ang),cy+R*Math.sin(ang)); ctx.stroke();
  }
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var ang=2*Math.PI*i/n-Math.PI/2;
    var r=R*norms[i];
    var x=cx+r*Math.cos(ang), yy=cy+r*Math.sin(ang);
    i===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(37,99,235,0.2)'; ctx.fill();
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5; ctx.stroke();
  for(var i=0;i<n;i++){
    var ang=2*Math.PI*i/n-Math.PI/2;
    var r=R*norms[i];
    var x=cx+r*Math.cos(ang), yy=cy+r*Math.sin(ang);
    ctx.beginPath(); ctx.arc(x,yy,5,0,2*Math.PI);
    ctx.fillStyle='#2563eb'; ctx.fill();
  }
  ctx.textAlign='center'; ctx.fillStyle='#1a2744';
  for(var i=0;i<n;i++){
    var ang=2*Math.PI*i/n-Math.PI/2;
    var lx=cx+(R+28)*Math.cos(ang), ly=cy+(R+28)*Math.sin(ang);
    ctx.font='bold 10px Arial'; ctx.fillStyle='#1a2744';
    ctx.fillText(labels[i],lx,ly);
    ctx.font='10px Arial'; ctx.fillStyle='#2563eb';
    ctx.fillText(secScores[i]+'/'+maxes[i],lx,ly+13);
  }
}

function fmt(n){
  if(typeof n!=='number') return '—';
  if(Math.abs(n)<1) return n.toFixed(2);
  return n.toLocaleString('it-IT',{maximumFractionDigits:0});
}
function fmtEur(n){ return n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}); }
function fmtPct(n){ return (n*100).toFixed(1)+'%'; }

function navigate(dir){
  var pages=document.querySelectorAll('.page');
  var dots=document.querySelectorAll('.step-dot');
  var seps=document.querySelectorAll('.step-sep');
  pages[cur].classList.remove('active');
  dots[cur].classList.remove('active');
  dots[cur].classList.add('done');
  if(seps[cur]) seps[cur].classList.add('done');
  cur=Math.max(0,Math.min(NPAGE-1,cur+dir));
  pages[cur].classList.add('active');
  dots[cur].classList.remove('done');
  dots[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function goToPage(p){
  if(p<0||p>=NPAGE) return;
  var pages=document.querySelectorAll('.page');
  var dots=document.querySelectorAll('.step-dot');
  pages[cur].classList.remove('active');
  dots[cur].classList.remove('active');
  if(p<cur) dots[cur].classList.remove('done');
  cur=p;
  pages[cur].classList.add('active');
  dots[cur].classList.remove('done');
  dots[cur].classList.add('active');
  updateNavInfo();
  if(cur===NPAGE-1) updateResults();
  window.scrollTo(0,0);
}

function buildSection(sec, pageEl) {
  var qs=QS.filter(function(q){return q.sec===sec;});
  var maxPts=SEC_MAX[sec];
  var html='<div class="sec-header"><span class="sec-badge">'+sec+'</span><h2>'+SEC_NAMES[sec]+'</h2></div>'
    +'<div class="sec-progress"><div class="sec-progress-fill" id="prog-'+sec+'" style="width:0%"></div></div>'
    +'<div class="sec-score-bar">Punteggio: <strong id="sscore-'+sec+'">0</strong> / '+maxPts+'</div>';
  qs.forEach(function(q,idx){
    html+='<div class="q-card">'
      +'<span class="q-num">'+q.id+'</span>'
      +'<div class="q-text">'+q.t+'</div>'
      +'<div class="radio-group">';
    q.opts.forEach(function(opt,oi){
      html+='<label class="radio-opt" id="lbl_'+q.id+'_'+(oi+1)+'">'
        +'<input type="radio" name="q_'+q.id+'" value="'+(oi+1)+'" onchange="onRadio(\''+q.id+'\','+(oi+1)+')">'
        +'<span class="opt-num">'+(oi+1)+'</span>'
        +'<span class="opt-text">'+opt+'</span>'
        +'</label>';
    });
    html+='</div>';
    html+='<button class="help-btn" onclick="toggleHelp(\''+q.id+'\')" type="button">&#9432; Informazioni utili</button>';
    html+='<div class="help-panel" id="help_'+q.id+'">'+q.h+'</div>';
    html+='</div>';
  });
  pageEl.innerHTML=html;
}

function onRadio(qid, val){
  for(var i=1;i<=5;i++){
    var lbl=document.getElementById('lbl_'+qid+'_'+i);
    if(lbl) lbl.classList.toggle('selected',i===val);
  }
  var q=QS.find(function(x){return x.id===qid;});
  if(!q) return;
  var sec=q.sec;
  var scores=getScores();
  var ss=getSecScore(sec,scores);
  var mx=SEC_MAX[sec];
  var prog=document.getElementById('prog-'+sec);
  if(prog) prog.style.width=Math.round(ss/mx*100)+'%';
  var ssc=document.getElementById('sscore-'+sec);
  if(ssc) ssc.textContent=ss;
}

function updateNetResult(){
  var t=parseFloat(document.getElementById('fin_turnover').value)||0;
  var d=parseFloat(document.getElementById('fin_direct').value)||0;
  var ic=parseFloat(document.getElementById('fin_indirect').value)||0;
  var dep=parseFloat(document.getElementById('fin_depreciation').value)||0;
  var net=t-d-ic-dep;
  var el=document.getElementById('fin_net');
  if(el){ el.value=net!==0?Math.round(net).toLocaleString('it-IT'):''; }
}

function finField(id, label, unit, helpText, type, defaultVal){
  return '<div class="fin-field">'
    +'<div class="fin-label">'+label+' <span>('+unit+')</span></div>'
    +'<input class="fin-input" type="'+type+'" id="'+id+'" placeholder="'+defaultVal+'" step="any">'
    +'<button class="help-btn" onclick="toggleHelp(\'fin_'+id+'\')" type="button" style="margin-top:6px">&#9432; Guida alla compilazione</button>'
    +'<div class="help-panel" id="help_fin_'+id+'">'+helpText+'</div>'
    +'</div>';
}

function buildStepBar(){
  var bar=document.getElementById('step-bar');
  var names=["Brevetto", "Sez. A", "Sez. B", "Sez. C", "Sez. D", "Sez. E", "Finanza", "Risultati"];
  var html='';
  for(var i=0;i<NPAGE;i++){
    if(i>0) html+='<div class="step-sep" id="sep-'+(i-1)+'"></div>';
    html+='<div class="step"><div class="step-dot'+(i===0?' active':'')+'\" id="dot-'+i+'" onclick="goToPage('+i+')">'+(i+1)+'</div>'
      +'<span class="step-label">'+names[i]+'</span></div>';
  }
  bar.innerHTML=html;
}



document.addEventListener('DOMContentLoaded', function(){
  buildPages();
  buildStepBar();
  updateNavInfo();
  
});
