<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TIP4PATLIBS &ndash; IPScore questionnaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #be0f05; --ink: #0b0b0b; --ink2: #475569; --muted: #94a3b8;
    --surface: #fcfcfb; --grid: #e2e8f0; --panel: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface); color: var(--ink);
  }
  header {
    text-align: center; padding: 40px 24px 24px;
  }
  header .badge {
    display: inline-block; background: var(--accent); color: #fff; padding: 12px 20px;
    border-radius: 12px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    margin-bottom: 14px;
  }
  header .sub { color: var(--ink2); font-size: 15px; max-width: 640px; margin: 0 auto; line-height: 1.6; }
  #steps {
    display: flex; justify-content: center; gap: 6px; margin: 22px 0 8px; flex-wrap: wrap;
  }
  .step-dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--grid); cursor: pointer;
  }
  .step-dot.done { background: var(--accent); }
  .step-dot.current { background: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 8px 24px 60px; }
  .page { display: none; }
  .page.active { display: block; }
  h2 { font-size: 20px; margin: 18px 0 4px; }
  .hint { color: var(--ink2); font-size: 13.5px; line-height: 1.6; margin-bottom: 20px; }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  label.field small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 9px 12px; border: 1px solid var(--grid); border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--grid); border-radius: 8px;
    font-size: 14px; font-family: inherit; min-height: 60px;
  }
  .question {
    border: 1px solid var(--grid); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
    background: #fff;
  }
  .question .qid { font-weight: 700; font-size: 13.5px; }
  .question .money { color: var(--accent); font-size: 12px; font-weight: 700; margin-left: 6px; }
  .question .qtext { font-size: 14px; margin: 4px 0 10px; }
  .question .opt { display: block; font-size: 13.5px; padding: 4px 0; cursor: pointer; }
  .question .opt input { margin-right: 8px; }
  .question .help-toggle {
    font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 6px; display: inline-block;
  }
  .question .help { display: none; font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.5; }
  .question .help.open { display: block; }
  .nav { display: flex; justify-content: space-between; margin-top: 28px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px;
    border: none; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.secondary { background: var(--panel); color: var(--ink2); border: 1px solid var(--grid); }
  button:disabled { opacity: 0.4; cursor: default; }
  .summary-block { border: 1px solid var(--grid); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }
  .summary-block h3 { font-size: 14px; margin: 0 0 8px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; gap: 12px; }
  .summary-row .k { color: var(--ink2); }
  .summary-row .v { font-weight: 600; text-align: right; }
  #error { color: var(--accent); font-size: 13px; margin-top: 10px; display: none; }
  #downloaded { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
    border-radius: 10px; padding: 14px 18px; margin-top: 16px; font-size: 13.5px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="badge">TIP4PATLIBS &ndash; IPScore questionnaire</div>
  <div class="sub">
    Answer these once for a real patent, then download your answers and hand the file back to
    whoever is running the PATSTAT valuation &mdash; nothing here is sent anywhere or computed
    into a value. That happens afterwards, on TIP.
  </div>
</header>
<div id="steps"></div>
<main>
  <div id="pages"></div>
  <div class="nav">
    <button class="secondary" id="prevBtn" onclick="prevPage()">&larr; Back</button>
    <button class="primary" id="nextBtn" onclick="nextPage()">Next &rarr;</button>
  </div>
  <div id="error"></div>
  <div id="downloaded"></div>
</main>
<script>
const SECTIONS = [{"key": "A", "title": "Legal status"}, {"key": "B", "title": "Technology"}, {"key": "C", "title": "Market conditions"}, {"key": "D", "title": "Finance"}, {"key": "E", "title": "Strategy"}];
const QUESTIONS = [{"id": "A1", "section": "A", "factor": "Patent status", "question": "What is the status of the patent?", "explanation": "A patent application involves a considerable degree of uncertainty, in terms of whether the patent will be granted after novelty searching, evaluation of inventive step, and so forth. Hence a patent that has been granted gets a higher score than a patent application that has only recently been filed.", "answers": ["Patent not yet applied for", "Patent application filed", "Novelty search and patentability evaluation completed", "Patent granted", "Opposition period expired"], "money": false}, {"id": "A2", "section": "A", "factor": "Legal position of strength", "question": "What is the patent's legal position of strength?", "explanation": "This factor relates to the defensibility and robustness of the patent, in disputes and legal proceedings, for example. During the different stages of the application period, it could also entail an assessment of the application`s likelihood of being refused or limited. A newly-issued patent may risk subsequent revocation if opposition is filed. With more mature patents there is the possibility of legal proceedings placing the validity of the patent under close scrutiny. If patents have faced up to such attacks and withstood them, they can be considered more defensible and hence more valuable. However, oppositions and court proceedings against patents are rare. Hence the rating scale that is used places importance on what you personally can do to clarify patent defensibility in relation to existing patents, prior art and so forth.", "answers": ["No novelty search", "Quick and dirty' search (simple database search) performed", "National office novelty search or similar", "International novelty search", "Novelty search and infringement search"], "money": false}, {"id": "A3", "section": "A", "factor": "Patent term remaining", "question": "For how long is the patent still valid?", "explanation": "An assessment of the stage the patent has reached in its life cycle. Is it new, mature or about to expire? Where it is possible to extend the term of the patent, as in pharmaceutical products for example, the extension must be included in the patent term remaining.", "answers": ["Patent has 0-2 year term remaining", "Patent has 2-4 year term remaining", "Patent has 4-8 year term remaining", "Patent has 8-12 year term remaining", "Patent has more than a 12-year term remaining"], "money": false}, {"id": "A4", "section": "A", "factor": "Breadth of claim", "question": "How broad and comprehensive are the patent claims?", "explanation": "The breadth of a patent's claims can be a determining factor in constructing a protective shield around the essence of an invention. Also, a broad claim will enjoy a wider range of possible constructional embodiments, thus increasing the patent`s scope for utilisation. The broader the claims, the greater the potential value of the patent.", "answers": ["The claims are very narrow and specific", "The claims are quite narrow", "The claims are reasonably broad", "The claims are broadly inclusive", "The claims comprise a general principle"], "money": false}, {"id": "A5", "section": "A", "factor": "Geographical coverage", "question": "Does the patent's geographical coverage include the relevant markets?", "explanation": "Patents held in many countries are considered more valuable than patents offering protection in one country only. Of course, only the relevant countries are significant, i.e. countries in your own market area and your competitors` market areas, copycat countries, and countries providing raw materials or production.", "answers": ["Patent protection in a single national market only", "Patent protection in a few market area countries", "Patent protection in most market area countries", "Patent protection in all existing market area countries", "Patent protection in all existing and potentially relevant market area countries"], "money": false}, {"id": "A6", "section": "A", "factor": "Monitoring against infringements", "question": "Are patents monitored to identify infringements?", "explanation": "This assessment factor will demonstrate the company's ability and willingness to monitor its rights. Has a formal monitoring process, of any kind, been established - or is monitoring to identify infringements more random? If patent monitoring is a more or less random affair, it will have a negative effect on the value of the patent. Granted rights are not worth much if no steps are taken to maintain them.", "answers": ["No monitoring against infringement", "Random monitoring via reports from sales agents", "Some degree of systematic monitoring of selected competitor products", "Systematic monitoring of markets", "Formalised global monitoring"], "money": false}, {"id": "A7", "section": "A", "factor": "Legal proceedings", "question": "Are disputes and legal proceedings customary in the operative markets?", "explanation": "A patent is valuable on an aggressive market where battles are waged. Nevertheless, disputes and legal proceedings earn a low score, as they are often demanding on company resources, while the lack of a tradition for disputes and legal proceedings earns a high score.", "answers": ["Legal proceedings are very customary", "Legal proceedings exist", "Disputes are customary", "Disputes exist", "Disputes and legal proceedings are not customary"], "money": false}, {"id": "A8", "section": "A", "factor": "Enforcement means", "question": "Does the company have the means to enforce patent rights?", "explanation": "A company's resources are assessed according to its ability to take patent infringers to court. If a company does not have the financial means to prosecute rights infringement, this will have a negative effect on the value of the patent.", "answers": ["In general, too expensive and difficult to enforce patent rights", "Patent rights enforced in selected countries in important markets", "Patent rights enforced in case of selected competitors", "Patent rights enforced in nearly all cases if not too expensive", "Patent rights always enforced"], "money": false}, {"id": "B1", "section": "B", "factor": "Unique technology", "question": "Is the invention a unique technology?", "explanation": "This assessment factor concerns the degree to which the patented technology proves to be of groundbreaking nature in its field. In this context, it is not necessarily important whether the technology is original, much better in relation to prior art, or only slightly better than prior art/existing technology. The important thing is how superior the patent is in relation to existing technology. For example, a small change (modification) in an invention's fundamental technology may actually prove to be of essential importance, making the patent the most superior in its technological sphere.", "answers": ["The invention has a marginal effect in relation to existing technology", "The invention has some improvement of effect in relation to existing technology", "The invention has improvement of effect in relation to existing technology", "The invention has substantial improvement of effect and is clearly groundbreaking", "The invention can change the way in which the industry operates/ works"], "money": false}, {"id": "B2", "section": "B", "factor": "Substitute technology", "question": "Is the invention technically superior to substitute technology?", "explanation": "The patent's technology is assessed in relation to other technologies that can be used as substitutes, i.e. other technology which can be used instead of the patented technology. It may not be of much value to develop a new method for stamping letters if you can imagine more and more communication taking place via the internet or other channels of telecommunication. This does not mean that there is no value in having a patent for a letter-stamping device, but that its value would have been greater had the internet not existed. The extent to which a company should evaluate substitute technology is an open question. The internet, for example, makes it possible to hold meetings without having to meet physically, and could therefore be regarded as substitute technology in relation to trains and planes. It is up to the company to decide how this assessment is carried out, and how broad the search for substitute technology needs to be.", "answers": ["The technology is representative of a field where there is new, substitute and dominating technology", "There is a reasonably wide area of substitute technology", "There is substitute technology, but it is limited in use and range", "There is substitute technology which is not yet competitive", "There are no known substitute technologies"], "money": false}, {"id": "B3", "section": "B", "factor": "Testing of the invention", "question": "To what extent has the invention been tested?", "explanation": "A patent's value increases as it matures technologically on its way towards being commercially worked, from initial testing to full-scale production. It is especially important for the tests for a complex technology to be reproducible. In a sales situation, the level of testing can be crucial to royalty agreements.", "answers": ["The invention has been tested in theory according to calculations", "There have been experiments/ one-off tests", "Production test has been completed", "Production running in", "Full-scale production"], "money": false}, {"id": "B4", "section": "B", "factor": "Production skills/equipment", "question": "Does the patented technology call for new skills, qualifications, or production equipment?", "explanation": "This assessment factor attempts to clarify whether the existing production apparatus is suitable for the technology of the patent, or if it is presumed that new and more competent production methods will be developed - which could entail developing and establishing an entire production plant or improving employees' qualifications and skills. In that respect you can elect to assess the company's own general qualification needs or whether the technology in general places new demands on the qualifications of, for example, potential buyers of the technology.", "answers": ["The patent requires an entirely new production process", "Substantial development of production processes is required before the patent can be utilised", "Some development of production processes is required before the patent can be utilised", "Only slight development of production processes is required before the patent can be utilised", "The patent can be utilised with the current production technology"], "money": false}, {"id": "B5", "section": "B", "factor": "Pre-commercial term of development", "question": "How much time is required before the patented technology can be commercially worked?", "explanation": "This assessment factor relates to the amount of time required in the future for product and/or process development before the patented technology becomes a saleable product and/or a usable process.The default rating scale is expressed in years, as follows: 0, ½, 1 year and thereafter in whole years. The information given in this assessment factor is used in the calculations for the forecast of financial results where, apart from the initial half-year, only whole numbers can be used. Note that the amount of time required for development will consequently move forward the product's market life expectancy period. See assessment factor C3.", "answers": ["5 years before commercialisation", "2 years", "1 year", "½ year", "0 years - ready for commercial activities"], "money": true}, {"id": "B6", "section": "B", "factor": "Production of infringing copycat products", "question": "Are infringing copycat products easy to produce?", "explanation": "Here you assess whether it is technically easy or difficult for a potential competitor to copy and utilise the invention. Other things being equal, a patent is stronger when the invention is difficult to copy.", "answers": ["The technology is easily identified and easy to copy and produce", "The technology is easy to copy and produce", "The technology is comparatively easy to identify and to copy and produce", "The technology is complex and difficult to copy and produce", "The technology is complex and extremely difficult to copy and produce"], "money": false}, {"id": "B7", "section": "B", "factor": "Identifiable infringing products", "question": "Are products of infringing nature easy to identify?", "explanation": "If it is very easy to identify infringing products, there will be something of a barrier against infringements. Furthermore, enforcement of patent rights becomes more straightforward when infringements can be identified and proved. If it is difficult to identify infringers, it will be difficult to maintain the advantage offered by exclusive rights and hence the advantage offered by the patent.", "answers": ["It is extremely difficult to identify infringing copycat products", "It is difficult but not impossible to identify infringing copycat products", "It is comparatively easy to identify infringing copycat products", "It is easy to identify infringing copycat products", "It is extremely easy to identify infringing copycat products"], "money": false}, {"id": "B8", "section": "B", "factor": "Dependent on licence agreements", "question": "Does deployment of the technology depend on licence agreements with others?", "explanation": "Production and sale of the patent product may depend on other patents owned by other companies. In such situations, licence agreements have to be made before the patent in question can be used. Any such potential licence negotiations may prevent the patent from being commercially worked, incurring a risk of limited earnings.", "answers": ["Use of the patent is dependent on extensive licence agreements with competitors", "Use of the patent is dependent on some licence agreements with competitors", "Use of the patent is not dependent on any particular licence agreements with competitors", "Use of the patent is dependent on licence agreements, but not with competitors", "Use of the patent is independent of licence agreements"], "money": false}, {"id": "B9", "section": "B", "factor": "Marketing value", "question": "Does the technology have marketing value (customer value)?", "explanation": "This assessment factor determines the degree to which the defining feature of the patent is able to contribute to the sales process. How well can the essential feature of the patent be communicated, and is it marketable? Does the patent provide a given product with a new feature, thereby effecting an increase in sales, for example by means of a relaunch? Note however that there is a difference between giving the product a new function, which reduces costs, and providing new features which will improve the communication value/utility value for the buyer.", "answers": ["The patent provides an improvement of product utility value which is very difficult to communicate", "The patent provides an improvement of product utility value which is difficult to communicate", "The patent provides a communicable improvement of product utility value", "The patent provides a mild improvement of product utility value which is easy to communicate", "The patent provides distinctive features which can be used for marketing the product"], "money": false}, {"id": "C1", "section": "C", "factor": "Marketing options", "question": "What are the marketing options?", "explanation": "This assessment factor is an evaluation of market demands, in a broad sense. It is an assessment of whether there are actual and potential demands for the service or product with which the patent is concerned. Therefore a market analysis must be performed to establish whether demand for this service or product even exists in the relevant market. In keeping with the general theory of supply and demand, when there is high demand for a product, the asking price for it will, other things being equal, be higher than when there is lower demand for a constant supply. That means that the higher the demand for the patent product/service, the higher its value will be.", "answers": ["There is no known market for the patented technology", "The patented technology has not yet been targeted at a particular market", "There is a well-known market for the patented technology", "There is a well-known market and further, well-defined market options", "There is a well-known market and other tangible prominent markets"], "money": false}, {"id": "C2", "section": "C", "factor": "Market growth rate", "question": "What is the market growth in the business area where the patented technology is utilised?", "explanation": "This assessment factor determines the foreseeable market growth in the business area of the patented technology. The rating scale is expressed as percentage growth in the market. The information is used to calculate the growth in turnover attributable to the patented technology. In the calculations for the forecast of financial results it is assumed that company turnover, in the business area market, will grow at an equal rate. Note that the calculations for market growth commence from the present moment in time, i.e. regardless of a possible period of development prior to commercialisation. Note also that a distinction is made between the market where the patented technology is put to use and the other markets the company operates in. In this assessment factor you determine the growth in the market used by the patented technology, whereas the overall expected growth in company-operated markets, excluding those of the patented technology, are given as `% in growth`, in the \"Financial results\" category. This information is used in the calculations for the area of total company growth in turnover, which excludes the patented technology.", "answers": ["Very low (½%)", "Low (2½%)", "Medium (5%)", "High (8%)", "Very high (15%)"], "money": true}, {"id": "C3", "section": "C", "factor": "Life expectancy", "question": "What is the life expectancy of the patented technology in the market?", "explanation": "This assessment factor determines the period of time, subsequent to market launch, that the patented product or patented process/service is on the market. If for example there is a two-year period prior to the possibility of the patented technology being commercially worked, the life expectancy of the patented technology will commence at the end of this two-year period. The default life expectancy period is expressed in whole years from 1 to 8 years, apart for the initial half-year. This estimation of the life expectancy of the patented technology on the market determines the calculation period used for the net present value calculations. (Your attention is drawn to assessment factor B5, where the estimated period of growth in the market begins immediately and covers both the product development period and the life expectancy period on the market, albeit with a limited calculable period of (max.) 10 years.)", "answers": ["½ year", "1 year", "2 years", "4 years", "8 years"], "money": true}, {"id": "C4", "section": "C", "factor": "Competitive/substitute products", "question": "Are competitive or substitute products active in the market?", "explanation": "How probable is it that competitive or substitute technologies are being developed? Competitors' development capabilities have to be analysed to ascertain whether market exclusivity can be maintained for the product/service concerned. If it is highly probable that competitive or substitute technologies are being developed, this will have an adverse effect on the value of the patent. This is because patent exclusivity is weakened when other solutions to the same problem appear.", "answers": ["There is a high degree of development of competitive or substitute technology", "It is probable that competitive or substitute technology is being developed", "There is a 50% chance that competitive or substitute technology is being developed", "Exclusivity in the market is a good probablility", "Exclusivity in the market is by and large certain"], "money": false}, {"id": "C5", "section": "C", "factor": "Attainable ultimate sales price", "question": "What ultimate sales price is the consumer willing to pay compared to existing known products?", "explanation": "What is the highest potential sales price that can be obtained for the product in the relevant markets if sales success is to be achieved? This factor is a direct analysis of the ultimate price, in relation to existing, known products, that the consumer/buyer is prepared to pay for a product having the qualities/properties which the technology/product/service will provide. The higher the attainable price for the product, etc., the higher the value of the patent will be. Sometimes the price is set at a cost lower than that of the competitors, e.g. because the product is easier to produce. Allowances for such factors have been taken into account in other evaluation factors, e.g. those concerning production costs and investments.", "answers": ["Attainable sales price significantly lower than competitors` price", "Lower than competitors` price", "Price equal to competitors`", "Higher than competitors` price", "Significantly higher than competitors` price"], "money": false}, {"id": "C6", "section": "C", "factor": "Potential extra turnover", "question": "What is the potential extra turnover to be obtained within the business area when utilising the patented technology?", "explanation": "This assessment factor determines what effect utilising the patented technology has on the current business area turnover. Does utilising the patented technology capture market share and thereby increase business area turnover? In the rating scale, the potential increase in turnover is expressed as the foreseeable percentage rise in current business area turnover. The current turnover figure is given in the \"Financial results\" category. The information is used in the forecast of financial results to calculate the share of the total increase in turnover attributable to the patented technology.", "answers": ["Very small extra turnover in the business area (½%)", "Small (2%)", "Medium (4%)", "Large (6%)", "Very large (10%)"], "money": true}, {"id": "C7", "section": "C", "factor": "Knowledge of commercial opportunities", "question": "What knowledge does the company have of application potential and commercial opportunities?", "explanation": "This assessment factor requires an evaluation by the company of the extent of their knowledge regarding possible application uses, the potential they embody, and the opportunities thus created for commercially working the patented technology. The technology covered by the patent is evaluated from as broad a perspective as possible, also with respect to non-traditional markets and applications.", "answers": ["Current company knowledge is of limited application potential only", "Limited knowledge of application potential and commercial opportunities", "Knowledge of application potential â€“ limited knowledge of commercial opportunities", "Knowledge of application potential and commercial opportunities", "The company has a full knowledge of application potential and commercial opportunities"], "money": false}, {"id": "C8", "section": "C", "factor": "Potential licensing revenue", "question": "Does the patented technology embody potential revenue from licensing agreements?", "explanation": "Here you assess the potential for licensing agreements. Is the patent a specialised-area patent, of interest only to closely connected competitors, and therefore embodying few opportunities for licensing agreements? Or is it possible that the technology can set new standards and create numerous licensing opportunities? Does the patent embody opportunities outside the key area the company operates in? Is patent licensing common in this area? Are changes due? A point worth considering is whether there is a hidden opportunity for licensing agreements with potential infringers, who could be contacted and sold a licence.", "answers": ["No relevant prospects for creating revenue from licensing agreements", "Licensing revenue is possible to a lesser degree", "Good prospects/ potential for creating revenue from licensing agreements", "Very good prospects/ potential for creating revenue from licensing agreements", "Extremely good prospects/ potential for creating revenue from licensing agreements"], "money": false}, {"id": "C9", "section": "C", "factor": "Permit/licence requirements", "question": "Do commercial activities require special permits/ licences", "explanation": "In some situations special permits/licences must be obtained from public authorities or similar authorities. In these cases such conditions should be assessed, as it may not be possible for the patent to be commercially worked until the permits/licences are obtained.", "answers": ["Permit/licence required. Refusal from public authorities", "Permit/ licence application not submitted to authorities or already submitted but provisionally refused", "Permit/ licence application submitted to authorities - no answer yet", "Limited-term permit/ licence approval from public authorities", "Life-term permit/ licence approval from public authorities, or no permit/licence required to sell patent/product in the market"], "money": false}, {"id": "D1", "section": "D", "factor": "Business output maintainability", "question": "Can the existing business area output in the relevant market be maintained without utilising the patented technology?", "explanation": "This assessment factor determines whether the patented technology is an essential element in maintaining business area turnover for the patented product/service. If the entire business area turnover can be maintained without the patented technology, it becomes, in principle, superfluous; whereas if the company is unable to maintain business area turnover/output without it, the patented technology is an essential element. The rating scale expresses the percentage of business area turnover that can be maintained without the patent. The information is used to calculate how great a share of the business area turnover/output can be achieved if the patented technology is kept in force.", "answers": ["100% of business output can be maintained without the patented technology", "75%", "50%", "25%", "0%"], "money": true}, {"id": "D2", "section": "D", "factor": "Future cost of development", "question": "What are the necessary future development costs?", "explanation": "This assessment factor is for determining the development costs incurred annually before the patent product/service is ready for use commercially. It is only the future development costs which are to be assessed, including patenting costs and market introduction costs, but excluding costs already accounted for. In the rating scale, the estimated figure for cost of development is expressed as a percentage of the current business area turnover, where turnover refers to the turnover figure given in the \"Financial results\" category. This information is used to calculate the remaining investments for product/service development before the product is saleable or the service is usable.", "answers": ["Extremely high investment (30% of business area turnover)", "Very high (15%)", "High (8%)", "Medium (2.5%)", "Low (½%)"], "money": true}, {"id": "D3", "section": "D", "factor": "Cost of production", "question": "What is the index for cost of production when implementing the patented technology?", "explanation": "The future production costs for the patent-related product are assessed in relation to the level of the current production costs in the company. You need to determine whether the patent-related product will be easier and cheaper to produce compared to production at present due to implementation of the patented technology, or whether implementation of the patented technology will make the production process more difficult and thereby more expensive. In the rating scale, production costs are expressed as percentage change in level in relation to the current level of production costs. This information is used in the calculations for the forecasts of financial results, primarily in the profit calculations.", "answers": ["30% increase due to use of the patented technology", "15% increase due to use of the patented technology", "No increase or decrease", "15% decrease due to use of the patented technology", "30% decrease due to use of the patented technology"], "money": true}, {"id": "D4", "section": "D", "factor": "Investment intensity", "question": "What investment is necessary for production equipment?", "explanation": "This assessment factor determines whether the current level of investment for production equipment is affected by the new production technology. Does the new patented technology affect the current level of investment necessary for production of the related patent product? The rating scale expresses the percentage change expected in relation to the current investment intensity for production equipment. If the necessary production technology costs the same as the existing technology, the score is 100%. If it is less expensive, the score will be less than 100%. If there is a need for investments over and above the existing level, the score will be higher than 100%. This information is used to calculate investments and re-investments when production equipment is depreciated and has an effect on liquidity.", "answers": ["120% of present investment intensity", "110% of present investment intensity", "100% of present investment intensity - investment-neutral", "70% of present investment intensity", "50% of present investment intensity"], "money": true}, {"id": "D5", "section": "D", "factor": "Financial capacity to cover renewal fees", "question": "Does the company have the financial capacity to cover patent renewal fees in the relevant markets?", "explanation": "Obviously, the company must have the financial ability to cover renewal fees if the patent is to maintain its value. If the company owns a patent registered in several countries, the renewal fees will be a not insignificant amount.", "answers": ["Maintenance in one country", "2-5 countries", "5-10 countries", "10-15 countries", "Over 15 countries/all current and potential countries"], "money": false}, {"id": "D6", "section": "D", "factor": "Contribution to company profits", "question": "What is the patented technology`s contribution to company profits?", "explanation": "This is an evaluation of the patented technology's estimated contribution to company profits. The evaluation can be compared with the patented technology's calculated net present value and the patent strategic profile, and on this basis can provide a profile illustrating the degree to which the patented technology and patent are of strategic importance for the company.", "answers": ["Less than 3% of accumulated profits", "Between 3 and 10% of accumulated profits", "Between 10 and 15% of accumulated profits", "Between 15 and 25% of accumulated profits", "More than 25% of accumulated profits"], "money": false}, {"id": "E1", "section": "E", "factor": "Securing existing markets", "question": "Is the object of the patent to secure position held in existing markets?", "explanation": "Patents can be used to secure the right to produce or sell a product or service in the markets you know. Clusters of patents can be accumulated which, by acting as barriers, make it particularly difficult for competitors to penetrate the market.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E2", "section": "E", "factor": "Winning new markets", "question": "Is the object of the patent to win new markets?", "explanation": "Patents can play a part in ensuring the right to invade and conquer new markets. Clusters of patents can be accumulated/amassed which, by acting as barriers, make it particularly difficult for competitors to penetrate the market.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E3", "section": "E", "factor": "Image building", "question": "Is the object of the patent part of an image-building process?", "explanation": "Patents can be used to demonstrate that a company is innovative, for example, and a forerunner in technological development - or they can be used for some other form of image building.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E4", "section": "E", "factor": "Ensuring \"freedom to operate\"", "question": "Is the object of the patent to ensure \"freedom to operate\" - to ensure the space for your own development activities?", "explanation": "Patents can be used as elbow room for the company's future technological development so that access to subsequent utilisation in the market is ensured. It is important to be ahead of your competitors in recognising the potential in a technological area.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E5", "section": "E", "factor": "Restricting competitive development", "question": "Is the object of the patent to restrict competitive development?", "explanation": "Patents can be used to capture areas of technology. This will obstruct future competitive development and competitive access to operate in given markets. If there are already a number of patents within the area in question, it will be extremely difficult for the competitor to develop his own products.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E6", "section": "E", "factor": "Licence or sales agreement", "question": "Does the company use the patent for licence or sales agreements?", "explanation": "Patents can form the basis for establishing licence or sales agreements for technological knowledge, or they can be an instrument in cross-licensing agreements.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E7", "section": "E", "factor": "Part of core-technology areas", "question": "Does the patent form part of the company's core-technology areas?", "explanation": "A patent can be part of one or more of the company's core-technology areas, either independently or in connection with other company patents.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}, {"id": "E8", "section": "E", "factor": "Correlation between patent and company business strategy", "question": "Is there alignment between the patent and the company's business strategy?", "explanation": "There are various ways in which a patent can contribute to the company's business strategy - or vice versa, so that a particular patent field benefits from the support of the business strategy.", "answers": ["No", "To a minor degree", "To some degree", "To a large degree", "To a very large degree"], "money": false}];
const DEFAULTS = {"patent": {"title": "Method for detecting and characterising a microorganism", "plain_title": "Rapid identification and antibiotic-susceptibility testing of bacteria", "publication": "EP3074539B1", "docdb_family_id": 53398085, "applicant": "Q-Linea AB, Uppsala (SE)", "field": "in-vitro diagnostics / antimicrobial resistance"}, "financials": {"turnover": 1500000, "direct_costs": 900000, "indirect_costs": 225000, "depreciation": 45000, "depreciation_period": 7, "business_area_share": 0.4, "discount_rate": 0.12}, "financials_note": "Illustrative figures for a mid-size diagnostics company - NOT Q-Linea AB's accounts. PATSTAT holds no financial data; these were chosen to make the model legible and must not be read as anything about the real company.", "scores": {"A1": 4, "A2": 4, "A3": 4, "A4": 3, "A5": 3, "A6": 2, "A7": 3, "A8": 3, "B1": 4, "B2": 4, "B3": 3, "B4": 4, "B5": 3, "B6": 3, "B7": 4, "B8": 3, "B9": 3, "C1": 4, "C2": 4, "C3": 5, "C4": 3, "C5": 3, "C6": 3, "C7": 3, "C8": 3, "C9": 4, "D1": 4, "D2": 3, "D3": 4, "D4": 4, "D5": 3, "D6": 3, "E1": 4, "E2": 3, "E3": 4, "E4": 3, "E5": 3, "E6": 4, "E7": 4, "E8": 3}};
const PATENT_FIELDS = [["publication", "Publication number", "text", "e.g. EP1234567B1"], ["docdb_family_id", "DOCDB family ID", "number", "what notebook 2's PATSTAT queries key off"], ["applicant", "Applicant", "text", ""], ["field", "Technical field", "text", ""], ["title", "Title", "text", ""], ["plain_title", "Plain-language title", "text", "a one-line, non-technical description"]];
const FINANCIAL_FIELDS = [["turnover", "Business turnover (EUR)", "money"], ["direct_costs", "Direct costs (EUR)", "money"], ["indirect_costs", "Indirect costs (EUR)", "money"], ["depreciation", "Provision for depreciation (EUR)", "money"], ["depreciation_period", "Depreciation period (years)", "years"], ["business_area_share", "Business area share of turnover (%)", "percent"], ["discount_rate", "Discount rate (%)", "percent"]];

const state = {
  patent: {...DEFAULTS.patent},
  financials: {...DEFAULTS.financials},
  financials_note: DEFAULTS.financials_note,
  scores: {...DEFAULTS.scores},
};

let PAGE_COUNT = 0;
let current = 0;

function questionsFor(sectionKey) {
  return QUESTIONS.filter(q => q.section === sectionKey);
}

function fieldHtml(id, labelText, kind, help, value) {
  const inputType = (kind === "text") ? "text" : "number";
  const step = (kind === "percent") ? "0.1" : (kind === "years" ? "0.5" : "1");
  return `<label class="field">
    <span>${labelText}</span>
    <input type="${inputType}" step="${step}" data-field="${id}" value="${value}">
    ${help ? `<small>${help}</small>` : ""}
  </label>`;
}

function buildPatentPage() {
  let html = `<h2>The patent</h2>
    <div class="hint">Six fields identify the patent. The family ID is what notebook 2's
    PATSTAT queries key off once it runs on TIP; the rest is display text carried through the
    reports and the tool.</div>`;
  for (const [id, label, kind, help] of PATENT_FIELDS) {
    html += fieldHtml(id, label, kind, help, state.patent[id]);
  }
  return html;
}

function buildSectionPage(section) {
  let html = `<h2>${section.key} &middot; ${section.title}</h2>
    <div class="hint">Pick the answer that fits each question. Every answer starts on a
    plausible default &mdash; change any of them, or leave them as they are.</div>`;
  for (const q of questionsFor(section.key)) {
    const tag = q.money ? '<span class="money">&#128176; feeds the NPV</span>' : "";
    html += `<div class="question" id="q-${q.id}">
      <span class="qid">${q.id} &mdash; ${q.factor}</span>${tag}
      <div class="qtext">${q.question}</div>`;
    q.answers.forEach((a, i) => {
      const n = i + 1;
      const checked = (state.scores[q.id] === n) ? "checked" : "";
      html += `<label class="opt">
        <input type="radio" name="score-${q.id}" value="${n}" ${checked}
               onchange="setScore('${q.id}', ${n})"> ${n} &ndash; ${a}
      </label>`;
    });
    html += `<span class="help-toggle" onclick="toggleHelp('${q.id}')">why this is asked</span>
      <div class="help" id="help-${q.id}">${q.explanation}</div>
    </div>`;
  }
  return html;
}

function buildFinancialsPage() {
  let html = `<h2>The company</h2>
    <div class="hint">Seven figures straight from the annual accounts. PATSTAT holds no
    financial data, so these always stay a person's input.</div>`;
  for (const [id, label, kind] of FINANCIAL_FIELDS) {
    let value = state.financials[id];
    if (kind === "percent") value = (value * 100).toFixed(1);
    html += fieldHtml(id, label, kind, "", value);
  }
  html += `<label class="field"><span>One-line note on where these figures come from</span>
    <textarea data-field="financials_note">${state.financials_note}</textarea></label>`;
  return html;
}

function buildReviewPage() {
  const scored = Object.keys(state.scores).length;
  let html = `<h2>Review &amp; download</h2>
    <div class="hint">Check the summary below, then download your answers. Hand the file to
    whoever runs the PATSTAT valuation, or drop it into <code>0_questionnaire_upload/</code>
    yourself if you have access to the notebook.</div>`;

  html += `<div class="summary-block"><h3>Patent</h3>`;
  for (const [id, label] of PATENT_FIELDS) {
    html += `<div class="summary-row"><span class="k">${label}</span><span class="v">${state.patent[id]}</span></div>`;
  }
  html += `</div>`;

  html += `<div class="summary-block"><h3>Company figures</h3>`;
  for (const [id, label, kind] of FINANCIAL_FIELDS) {
    let value = state.financials[id];
    if (kind === "percent") value = (value * 100).toFixed(1) + " %";
    else if (kind === "money") value = Number(value).toLocaleString() + " EUR";
    html += `<div class="summary-row"><span class="k">${label}</span><span class="v">${value}</span></div>`;
  }
  html += `</div>`;

  html += `<div class="summary-block"><h3>Questionnaire</h3>
    <div class="summary-row"><span class="k">Answers given</span><span class="v">${scored} of 40</span></div>
  </div>`;

  html += `<button class="primary" onclick="downloadAnswers()">&#128229; Download my answers (questionnaire.json)</button>
    <div id="downloaded"></div>`;
  return html;
}

function toggleHelp(qid) {
  document.getElementById("help-" + qid).classList.toggle("open");
}

function setScore(qid, n) {
  state.scores[qid] = n;
}

function readPageInputs() {
  document.querySelectorAll("input[data-field], textarea[data-field]").forEach(el => {
    const id = el.dataset.field;
    if (id === "financials_note") {
      state.financials_note = el.value;
    } else if (id in state.patent) {
      state.patent[id] = (id === "docdb_family_id") ? parseInt(el.value || "0", 10) : el.value;
    } else if (id in state.financials) {
      let v = parseFloat(el.value || "0");
      const field = FINANCIAL_FIELDS.find(f => f[0] === id);
      if (field && field[2] === "percent") v = v / 100;
      state.financials[id] = v;
    }
  });
}

function buildPages() {
  const container = document.getElementById("pages");
  const parts = [buildPatentPage()];
  for (const s of SECTIONS) parts.push(buildSectionPage(s));
  parts.push(buildFinancialsPage());
  parts.push(buildReviewPage());
  PAGE_COUNT = parts.length;

  container.innerHTML = parts.map((html, i) =>
    `<div class="page" id="page-${i}">${html}</div>`).join("");

  const steps = document.getElementById("steps");
  steps.innerHTML = parts.map((_, i) =>
    `<div class="step-dot" id="dot-${i}" onclick="goToPage(${i})"></div>`).join("");
}

function goToPage(n) {
  readPageInputs();
  current = Math.max(0, Math.min(PAGE_COUNT - 1, n));
  document.querySelectorAll(".page").forEach((el, i) => el.classList.toggle("active", i === current));
  document.querySelectorAll(".step-dot").forEach((el, i) => {
    el.classList.toggle("current", i === current);
    el.classList.toggle("done", i < current);
  });
  document.getElementById("prevBtn").disabled = (current === 0);
  document.getElementById("nextBtn").style.visibility = (current === PAGE_COUNT - 1) ? "hidden" : "visible";
  if (current === PAGE_COUNT - 1) {
    document.getElementById("page-" + current).innerHTML = buildReviewPage();
  }
  document.getElementById("error").style.display = "none";
  window.scrollTo(0, 0);
}

function nextPage() { goToPage(current + 1); }
function prevPage() { goToPage(current - 1); }

function downloadAnswers() {
  readPageInputs();
  const missingPatent = PATENT_FIELDS.filter(([id]) => !state.patent[id] && state.patent[id] !== 0);
  if (missingPatent.length) {
    const err = document.getElementById("error");
    err.style.display = "block";
    err.textContent = "Please fill in: " + missingPatent.map(f => f[1]).join(", ");
    return;
  }
  const payload = {
    patent: state.patent,
    financials: state.financials,
    financials_note: state.financials_note,
    scores: state.scores,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "questionnaire.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const box = document.getElementById("downloaded");
  box.style.display = "block";
  box.innerHTML = "&#9989; Saved <code>questionnaire.json</code> to your downloads folder. " +
    "Drop that file into <code>0_questionnaire_upload/</code> next to this notebook, then run " +
    "notebook 0's loader cell.";
}

document.addEventListener("DOMContentLoaded", () => {
  buildPages();
  goToPage(0);
});
</script>
</body>
</html>
